<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Demande d'avance — Medellin Lounge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="shared.js" defer></script>
  <style>
/* ── Solde hero ── */
.solde-hero{
  background:var(--glow);border:1px solid var(--gring);
  border-radius:var(--r);padding:20px 16px;text-align:center;
  box-shadow:0 0 0 1px var(--gring) inset,0 4px 20px rgba(201,168,76,.12)}
.solde-hero-label{font-size:12px;color:var(--muted);text-transform:uppercase;
  letter-spacing:2px;margin-bottom:6px}
.solde-hero-val{font-family:'Bebas Neue',sans-serif;font-size:44px;
  color:var(--gold);line-height:1}
.solde-hero-sub{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}

/* ── Formulaire ── */
.avance-form-card{
  background:var(--bg2);border-radius:var(--r);padding:18px;
  border:1px solid var(--b1);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 2px 10px rgba(0,0,0,.4)}
.montant-input{
  font-family:'Bebas Neue',sans-serif;font-size:36px!important;
  text-align:center!important;letter-spacing:2px;
  color:var(--gold)!important;background:transparent!important;
  border:none!important;border-bottom:2px solid var(--gring)!important;
  border-radius:0!important;padding:8px 0!important;width:100%;outline:none}
.montant-input::placeholder{color:var(--muted)!important;font-size:24px}

/* ── Bouton envoi ── */
.btn-avance{
  background:linear-gradient(180deg,var(--goldl) 0%,var(--gold) 100%);
  border:none;border-radius:var(--r);padding:16px;width:100%;
  font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;
  color:#060606;cursor:pointer;
  box-shadow:0 4px 20px rgba(201,168,76,.25),0 1px 0 rgba(255,255,255,.15) inset;
  transition:opacity .15s,transform .1s;
  -webkit-tap-highlight-color:transparent;margin-top:4px}
.btn-avance:active{opacity:.85;transform:scale(.99)}
.btn-avance:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}

/* ── Avances list ── */
.avance-row{
  background:var(--bg2);border-radius:var(--rs);padding:13px 14px;
  display:flex;justify-content:space-between;align-items:flex-start;
  border:1px solid var(--b1)}
.avance-montant{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold)}
.avance-info{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
.chip{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;
  display:inline-block;margin-top:4px}
.chip-wait{background:rgba(255,180,0,.15);color:#ffb400;border:1px solid rgba(255,180,0,.25)}
.chip-ok  {background:rgba(61,184,115,.12);color:var(--ok);border:1px solid rgba(61,184,115,.2)}
.chip-ko  {background:rgba(255,80,80,.12);color:var(--danger);border:1px solid rgba(255,80,80,.2)}
  </style>
</head>
<body>
  <div id="__header__"></div>
  <div class="body-wrap" style="display:flex;flex-direction:column;gap:14px">

    <!-- Solde estimé -->
    <div class="solde-hero" id="solde-hero">
      <div class="solde-hero-label">Salaire net estimé</div>
      <div class="solde-hero-val" id="solde-val">—</div>
      <div class="solde-hero-sub">salaire de base − avances approuvées non remboursées</div>
    </div>

    <!-- Formulaire de demande -->
    <div class="avance-form-card">
      <div class="s-head" style="margin:0 0 14px">Nouvelle demande</div>
      <div class="field" style="margin-bottom:14px">
        <label style="text-align:center;display:block;margin-bottom:8px">
          Montant souhaité (GNF)
        </label>
        <input type="number" id="f-montant" class="montant-input"
          inputmode="numeric" placeholder="0"
          oninput="updateBtn()">
      </div>
      <div class="field" style="margin-bottom:14px">
        <label>Motif (optionnel)</label>
        <input type="text" id="f-note"
          placeholder="Ex : urgence médicale, transport…">
      </div>
      <div id="send-err" style="font-size:12px;color:var(--danger);min-height:16px;
        text-align:center;margin-bottom:8px"></div>
      <button class="btn-avance" id="btn-send" disabled onclick="soumettreAvance()">
        ENVOYER MA DEMANDE
      </button>
      <div style="font-size:11px;color:var(--muted);text-align:center;
        margin-top:10px;line-height:1.5">
        Votre demande sera soumise au manager pour approbation.<br>
        Aucune déduction avant validation.
      </div>
    </div>

    <!-- Historique avances -->
    <div class="s-head" id="hist-head" style="display:none">
      Avances en cours
    </div>
    <div id="avances-list"></div>

  </div>
  <div id="toast"></div>

<script>
let empId      = null;
let salaireBase = 0;
let sending    = false;

document.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('__header__').outerHTML = HEADER_HTML;
  if (!initPage(['staff','caissier','chicha','achats'])) return;

  const extra = ML.getExtra();
  empId = extra.employe_id || null;

  if (!empId) {
    document.querySelector('.body-wrap').innerHTML =
      '<div class="state-msg err">Compte employé non configuré.</div>';
    return;
  }

  await loadEmployee();
  await loadAvances();
});

async function loadEmployee() {
  try {
    const { data: emp } = await db.from('employes')
      .select('salaire_base').eq('id', empId).single();
    salaireBase = emp?.salaire_base || 0;
  } catch {}
}

async function loadAvances() {
  try {
    const { data } = await db.from('avances')
      .select('*')
      .eq('employe_id', empId)
      .eq('rembourse', false)
      .order('date', { ascending: false });

    const list = data || [];

    /* Solde */
    const totalDeduites = list
      .filter(a => a.statut === 'approuvee')
      .reduce((s, a) => s + (a.montant || 0), 0);
    const solde = Math.max(0, salaireBase - totalDeduites);
    $('solde-val').textContent = gnf(solde);

    /* Liste */
    if (!list.length) {
      $('hist-head').style.display = 'none';
      $('avances-list').innerHTML  = '';
      return;
    }

    $('hist-head').style.display = '';
    const LABELS = {
      en_attente : '<span class="chip chip-wait">⏳ En attente</span>',
      approuvee  : '<span class="chip chip-ok">✅ Approuvée</span>',
      rejetee    : '<span class="chip chip-ko">✕ Rejetée</span>'
    };

    $('avances-list').innerHTML = list.map(a => `
      <div class="avance-row">
        <div>
          <div style="font-size:14px;font-weight:500">${frDateShort(a.date)}</div>
          <div class="avance-info">${a.note_demande || a.obs || '—'}</div>
          ${LABELS[a.statut] || `<span class="chip">${a.statut}</span>`}
        </div>
        <div style="text-align:right">
          <div class="avance-montant">${gnf(a.montant)}</div>
        </div>
      </div>`).join('');

  } catch(e) {
    $('avances-list').innerHTML = `<div class="state-msg err">${e.message}</div>`;
  }
}

function updateBtn() {
  const m = parseInt($('f-montant').value) || 0;
  $('btn-send').disabled = m <= 0 || sending;
  $('send-err').textContent = '';
}

async function soumettreAvance() {
  const montant = parseInt($('f-montant').value) || 0;
  const note    = ($('f-note').value || '').trim();

  if (!montant || montant <= 0) {
    $('send-err').textContent = 'Entrez un montant valide.'; return;
  }

  /* Vérifier si une demande en attente existe déjà */
  try {
    const { data: pending } = await db.from('avances')
      .select('id').eq('employe_id', empId)
      .eq('statut', 'en_attente').limit(1);
    if (pending && pending.length > 0) {
      $('send-err').textContent = 'Vous avez déjà une demande en attente d\'approbation.';
      return;
    }
  } catch {}

  sending = true;
  $('btn-send').disabled = true;
  $('btn-send').textContent = 'ENVOI…';

  try {
    const { error } = await db.from('avances').insert({
      employe_id  : empId,
      date        : todayISO(),
      montant,
      statut      : 'en_attente',
      rembourse   : false,
      note_demande: note || null
    });
    if (error) throw error;

    $('f-montant').value = '';
    $('f-note').value    = '';
    $('send-err').textContent = '';
    toast('Demande envoyée — le manager sera notifié ✓', 'ok');
    ML.logAction(`💸 Demande avance — ${gnf(montant)}`);

    await loadAvances();
  } catch(e) {
    $('send-err').textContent = 'Erreur : ' + e.message;
  }

  sending = false;
  $('btn-send').disabled = false;
  $('btn-send').textContent = 'ENVOYER MA DEMANDE';
  updateBtn();
}
</script>
</body>
</html>
