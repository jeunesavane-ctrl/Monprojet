<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Produits — Medellin Lounge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="shared.js" defer></script>
  <style>
.prod-item{background:var(--bg2);border-radius:var(--rs);padding:12px 14px;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
.prod-info{flex:1;min-width:0}
.prod-nom{font-size:14px;font-weight:500}
.prod-meta{font-size:12px;color:var(--muted);margin-top:2px}
.prod-stock{text-align:right;flex-shrink:0}
.prod-stock-val{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold)}
.prod-stock-val.low{color:var(--danger)}
.prod-stock-lbl{font-size:11px;color:var(--muted)}
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--bg3);margin-bottom:4px}
.tab-bar{overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex:0 0 auto;padding:11px 14px;text-align:center;font-size:13px;font-weight:500;
  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;
  transition:all .15s;-webkit-tap-highlight-color:transparent}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.panel{display:none}.panel.active{display:flex;flex-direction:column;gap:12px}
.cmd-group{background:var(--bg2);border-radius:var(--r);padding:14px 16px}
.cmd-group-title{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--gold);
  letter-spacing:.5px;margin-bottom:8px;border-bottom:1px solid var(--bg3);padding-bottom:6px}
.cmd-row{display:flex;justify-content:space-between;align-items:center;
  padding:6px 0;border-bottom:1px solid var(--bg3);font-size:13px}
.cmd-row:last-child{border-bottom:none}
.cmd-nom{font-weight:500}
.cmd-qte{color:var(--danger);font-weight:600}
@media print{
  #__header__,nav,.tab-bar,.list-actions,#toast,
  #panel-chicha,#panel-boisson,#panel-ajout{display:none!important}
  #panel-commande{display:flex!important}
  body{background:#fff!important;color:#000!important}
  .cmd-group{background:#f5f5f5!important}
  .cmd-group-title,.cmd-nom{color:#000!important}
  .cmd-qte{color:#c00!important}
  @page{margin:15mm}
}
  </style>
</head>
<body>
  <div id="__header__"></div>
  <div class="body-wrap">
    <div class="tab-bar">
      <div class="tab-btn active" onclick="switchProdTab('chicha')">Chicha</div>
      <div class="tab-btn" onclick="switchProdTab('boisson')">Boissons</div>
      <div class="tab-btn" onclick="switchProdTab('commande')">Commande</div>
      <div class="tab-btn" onclick="switchProdTab('ajout')">+ Produit</div>
    </div>

    <div id="panel-chicha" class="panel active">
      <div id="list-chicha"><div class="state-msg">Chargement…</div></div>
    </div>

    <div id="panel-boisson" class="panel">
      <div id="list-boisson"><div class="state-msg">Chargement…</div></div>
    </div>

    <div id="panel-commande" class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="sec-title">Produits à commander</div>
        <button class="btn-secondary" style="font-size:12px;padding:6px 12px"
          onclick="window.print()">🖨 Imprimer</button>
      </div>
      <div id="cmd-content"><div class="state-msg">Chargement…</div></div>
    </div>

    <div id="panel-ajout" class="panel">
      <div class="card">
        <div class="card-head"><div class="card-title">Nouveau produit</div></div>
        <div class="card-body">
          <div class="field"><label>Nom du produit</label>
            <input id="np-nom" type="text" placeholder="Ex: Tabac fraise, Sprite 33cl…"></div>
          <div class="row2">
            <div class="field"><label>Type</label>
              <select id="np-type">
                <option value="chicha">Chicha</option>
                <option value="boisson">Boisson</option>
              </select>
            </div>
            <div class="field"><label>Prix vente (GNF)</label>
              <input id="np-prix" type="number" inputmode="numeric" placeholder="0"></div>
          </div>
          <div class="row2">
            <div class="field"><label>Stock actuel (unités)</label>
              <input id="np-stock" type="number" inputmode="numeric" placeholder="0"></div>
            <div class="field"><label>Seuil alerte (unités)</label>
              <input id="np-min" type="number" inputmode="numeric" placeholder="0"></div>
          </div>

          <!-- Emballage (optionnel, pour boissons achetées en gros) -->
          <div style="margin:10px 0 6px;font-size:11px;text-transform:uppercase;
            letter-spacing:1px;color:var(--muted)">📦 Emballage (gros) — optionnel</div>
          <div class="row2">
            <div class="field">
              <label>Unité de vente</label>
              <input id="np-unite" type="text" placeholder="bouteille, canette…">
            </div>
            <div class="field">
              <label>Type emballage</label>
              <input id="np-pack-label" type="text" placeholder="casier, carton…">
            </div>
          </div>
          <div class="row2">
            <div class="field">
              <label>Unités / emballage</label>
              <input id="np-pack-qty" type="number" inputmode="numeric"
                placeholder="24" min="1" value="1">
            </div>
            <div class="field">
              <label>Prix achat / unité (GNF)</label>
              <input id="np-prix-achat" type="number" inputmode="numeric" placeholder="0">
            </div>
          </div>

          <button class="btn-primary" onclick="saveProd()">ENREGISTRER</button>
        </div>
      </div>
    </div>
  </div>

  <div id="overlay">
    <div class="sheet">
      <div class="sheet-title" id="edit-title">Modifier le produit</div>
      <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:16px">
        <div class="field"><label>Nom</label>
          <input id="ep-nom" type="text"></div>
        <div class="row2">
          <div class="field"><label>Prix vente (GNF)</label>
            <input id="ep-prix" type="number" inputmode="numeric"></div>
          <div class="field"><label>Stock actuel (unités)</label>
            <input id="ep-stock" type="number" inputmode="numeric"></div>
        </div>
        <div class="row2">
          <div class="field"><label>Seuil alerte</label>
            <input id="ep-min" type="number" inputmode="numeric"></div>
          <div class="field"><label>Prix achat/unité</label>
            <input id="ep-prix-achat" type="number" inputmode="numeric"></div>
        </div>
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)">
          📦 Emballage</div>
        <div class="row2">
          <div class="field"><label>Unité vente</label>
            <input id="ep-unite" type="text" placeholder="bouteille…"></div>
          <div class="field"><label>Type emballage</label>
            <input id="ep-pack-label" type="text" placeholder="casier…"></div>
        </div>
        <div class="field"><label>Unités / emballage</label>
          <input id="ep-pack-qty" type="number" inputmode="numeric" min="1" value="1"></div>
      </div>
      <div class="sheet-btns">
        <button class="btn-cancel" onclick="closeOverlay()">Annuler</button>
        <button class="btn-ok" onclick="saveEdit()">ENREGISTRER</button>
      </div>
    </div>
  </div>
  <div id="toast"></div>

<script>
let editId = null;

document.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('__header__').outerHTML = HEADER_HTML;
  if (!initPage(['manager','owner'])) return;

  /* Vérification actif NULL → afficher migration si nécessaire */
  const { data: chkActif } = await db.from('produits').select('actif').is('actif', null).limit(1);
  if (chkActif?.length > 0) {
    const migrHint = document.createElement('div');
    migrHint.style.cssText = 'background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.4);border-radius:8px;padding:12px 14px;font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:12px';
    migrHint.innerHTML = `<strong style="color:var(--gold)">⚠ Migration requise — produits invisibles</strong><br>
      Des produits ont <code>actif = NULL</code> et n'apparaissent pas dans les ventes.<br>
      Exécutez <strong>une seule fois</strong> dans Supabase SQL Editor :<br>
      <code style="background:var(--bg3);padding:2px 6px;border-radius:4px;font-size:11px;display:block;margin-top:6px;white-space:pre;overflow-x:auto">UPDATE produits SET actif = true WHERE actif IS NULL;
ALTER TABLE produits ALTER COLUMN actif SET DEFAULT true;
ALTER TABLE produits ALTER COLUMN actif SET NOT NULL;</code>`;
    document.querySelector('.body-wrap')?.prepend(migrHint);
  }

  /* Vérification colonnes packaging */
  const { data: tst } = await db.from('produits').select('unite_vente').limit(1);
  if (tst === null || (Array.isArray(tst) && tst.length > 0 && !('unite_vente' in tst[0]))) {
    const sqlHint = document.createElement('div');
    sqlHint.style.cssText = 'background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.25);border-radius:8px;padding:12px 14px;font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:12px';
    sqlHint.innerHTML = `<strong style="color:var(--gold)">⚙ Migration stock (une seule fois)</strong><br>
      Exécutez dans Supabase SQL Editor pour activer la gestion par casier/carton :<br>
      <code style="background:var(--bg3);padding:2px 6px;border-radius:4px;font-size:11px;display:block;margin-top:6px;white-space:pre;overflow-x:auto">ALTER TABLE produits
  ADD COLUMN IF NOT EXISTS unite_vente TEXT DEFAULT 'unité',
  ADD COLUMN IF NOT EXISTS packaging_label TEXT,
  ADD COLUMN IF NOT EXISTS unite_par_packaging INTEGER DEFAULT 1,
  ADD COLUMN IF NOT EXISTS prix_achat INTEGER DEFAULT 0;</code>`;
    document.querySelector('.body-wrap')?.prepend(sqlHint);
  }

  loadProds();
});

function switchProdTab(tab) {
  ['chicha','boisson','commande','ajout'].forEach((t,i) => {
    $('panel-'+t)?.classList.toggle('active', t===tab);
    document.querySelectorAll('.tab-btn')[i]?.classList.toggle('active', t===tab);
  });
  if (tab === 'commande') loadCommande();
}

async function loadCommande() {
  const el = $('cmd-content');
  try {
    const { data } = await db.from('produits').select('*').not('actif','is',false).order('nom');
    const prods = data || [];
    const low = prods.filter(p => p.stock_min > 0 && (p.stock_actuel??0) <= p.stock_min);

    if (!low.length) {
      el.innerHTML = '<div class="state-msg">✅ Tous les stocks sont suffisants.</div>'; return;
    }

    const chicha  = low.filter(p=>p.type==='chicha');
    const boisson = low.filter(p=>p.type==='boisson');

    const buildGroup = (label, list) => list.length ? `
      <div class="cmd-group">
        <div class="cmd-group-title">${label} (${list.length})</div>
        ${list.map(p=>`
          <div class="cmd-row">
            <div class="cmd-nom">${p.nom}</div>
            <div style="text-align:right">
              <div class="cmd-qte">Stock : ${p.stock_actuel??0}</div>
              <div style="font-size:11px;color:var(--muted)">Seuil : ${p.stock_min}</div>
            </div>
          </div>`).join('')}
      </div>` : '';

    el.innerHTML = `
      <div style="font-size:12px;color:var(--muted);margin-bottom:4px">
        ${low.length} produit${low.length>1?'s':''} à réapprovisionner
      </div>
      ${buildGroup('CHICHA', chicha)}
      ${buildGroup('BOISSONS', boisson)}`;
  } catch(e) {
    el.innerHTML = `<div class="state-msg err">Erreur : ${e.message}</div>`;
  }
}

async function loadProds() {
  try {
    const { data } = await db.from('produits').select('*').not('actif','is',false).order('nom');
    const prods = data || [];
    ['chicha','boisson'].forEach(type => {
      const list = prods.filter(p=>p.type===type);
      const el   = $('list-'+type);
      if (!list.length) {
        el.innerHTML = `<div class="state-msg">Aucun produit de type ${type}.</div>`; return;
      }
      el.innerHTML = list.map(p => {
        const stock  = p.stock_actuel ?? 0;
        const isLow  = p.stock_min > 0 && stock <= p.stock_min;
        const isZero = stock <= 0;
        const packQty = p.unite_par_packaging || 1;
        const packLbl = p.packaging_label || '';
        const uniteLbl = p.unite_vente || 'unités';
        /* Affiche aussi l'équivalent en emballage si défini */
        const packEquiv = (packQty > 1 && packLbl)
          ? `<div style="font-size:10px;color:var(--muted);margin-top:2px">
              ≈ ${(stock/packQty).toFixed(1)} ${packLbl}</div>` : '';
        return `
          <div class="prod-item">
            <div class="prod-info">
              <div class="prod-nom">${p.nom}</div>
              <div class="prod-meta">
                Vente : ${gnf(p.prix_defaut||0)}
                ${p.prix_achat ? ` · Achat : ${gnf(p.prix_achat)}` : ''}
                ${packQty > 1 ? ` · ${packQty} ${uniteLbl}/${packLbl}` : ''}
              </div>
            </div>
            <div class="prod-stock">
              <div class="prod-stock-val ${isZero?'low':(isLow?'low':'')}">
                ${stock}</div>
              <div class="prod-stock-lbl">${isZero?'⚠ Rupture':isLow?'⚠ Stock bas':uniteLbl}</div>
              ${packEquiv}
            </div>
            <div class="list-actions">
              <button class="btn-icon" onclick='openEdit(${JSON.stringify(p)})'>✎</button>
              <button class="btn-icon" onclick="archiveProd('${p.id}')">✕</button>
            </div>
          </div>`;
      }).join('');
    });
  } catch(e) { toast('Erreur chargement : '+e.message,'ko'); }
}

async function saveProd() {
  const nom = $('np-nom').value.trim();
  if (!nom) { toast('Le nom est requis','ko'); return; }
  const packQty = parseInt($('np-pack-qty').value)||1;
  try {
    await db.from('produits').insert({
      nom,
      type:         $('np-type').value,
      prix_defaut:  parseFloat($('np-prix').value)||0,
      stock_actuel: parseFloat($('np-stock').value)||0,
      stock_min:    parseFloat($('np-min').value)||0,
      unite_vente:      ($('np-unite').value.trim()||'unité'),
      packaging_label:  ($('np-pack-label').value.trim()||null),
      unite_par_packaging: packQty > 1 ? packQty : 1,
      prix_achat:   parseFloat($('np-prix-achat').value)||0,
      actif: true
    });
    toast('Produit ajouté ✓','ok');
    ['np-nom','np-prix','np-stock','np-min','np-unite','np-pack-label',
     'np-pack-qty','np-prix-achat'].forEach(id => {
      const el = $(id); if(el) el.value = id==='np-pack-qty'?'1':'';
    });
    loadProds();
    switchProdTab('chicha');
  } catch(e) { toast('Erreur : '+e.message,'ko'); }
}

function openEdit(p) {
  editId = p.id;
  $('ep-nom').value       = p.nom;
  $('ep-prix').value      = p.prix_defaut||0;
  $('ep-stock').value     = p.stock_actuel??0;
  $('ep-min').value       = p.stock_min??0;
  $('ep-prix-achat').value = p.prix_achat||0;
  $('ep-unite').value     = p.unite_vente||'';
  $('ep-pack-label').value = p.packaging_label||'';
  $('ep-pack-qty').value  = p.unite_par_packaging||1;
  $('overlay').classList.add('on');
}
function closeOverlay() { $('overlay').classList.remove('on'); editId=null; }

async function saveEdit() {
  if (!editId) return;
  try {
    await db.from('produits').update({
      nom:          $('ep-nom').value.trim(),
      prix_defaut:  parseFloat($('ep-prix').value)||0,
      stock_actuel: parseFloat($('ep-stock').value)||0,
      stock_min:    parseFloat($('ep-min').value)||0,
      prix_achat:   parseFloat($('ep-prix-achat').value)||0,
      unite_vente:        ($('ep-unite').value.trim()||'unité'),
      packaging_label:    ($('ep-pack-label').value.trim()||null),
      unite_par_packaging: parseInt($('ep-pack-qty').value)||1
    }).eq('id',editId);
    toast('Produit mis à jour ✓','ok');
    closeOverlay(); loadProds();
  } catch(e) { toast('Erreur : '+e.message,'ko'); }
}

async function archiveProd(id) {
  if (!confirm('Supprimer ce produit ?')) return;
  try {
    await db.from('produits').update({actif:false}).eq('id',id);
    loadProds();
  } catch(e) { toast('Erreur','ko'); }
}
</script>
</body>
</html>
