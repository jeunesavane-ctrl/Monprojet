<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Paramètres — Medellin Lounge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="shared.js" defer></script>
  <style>
.pc-body{display:none;flex-direction:column;gap:14px;padding:14px 16px;
  border-top:1px solid var(--bg3)}
.pc-body.open{display:flex}
.pc-dots{display:flex;gap:12px;justify-content:center}
.pc-dot{width:12px;height:12px;border-radius:50%;background:var(--bg3);
  border:2px solid var(--bg4);transition:all .15s}
.pc-dot.on{background:var(--gold);border-color:var(--gold)}
.pc-err{font-size:13px;color:var(--danger);text-align:center;min-height:16px}
.pc-hint{font-size:13px;color:var(--muted);text-align:center}
.pc-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pc-key{height:54px;background:var(--bg3);border:1px solid var(--bg4);
  border-radius:var(--rs);font-size:20px;font-weight:500;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .1s,transform .1s;-webkit-tap-highlight-color:transparent}
.pc-key:active{background:var(--bg4);transform:scale(.92)}
.pc-key.del{font-size:15px;color:var(--muted)}
.pc-key.void{visibility:hidden}
.log-item{display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--bg3);font-size:13px}
.log-item:last-child{border-bottom:none}
.log-role{font-weight:500}
.log-ts{font-size:11px;color:var(--muted)}
.assoc-item{background:var(--bg2);border-radius:var(--rs);padding:12px 14px;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.assoc-nom{font-size:14px;font-weight:500}
.assoc-pct{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold)}
.assoc-info{font-size:12px;color:var(--muted);margin-top:2px}
.emp-item{background:var(--bg2);border-radius:var(--rs);padding:12px 14px;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
.emp-nom{font-size:14px;font-weight:500}
.emp-meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.role-chip{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.role-chip.manager{background:rgba(201,168,76,.15);color:var(--gold)}
.role-chip.caissier{background:rgba(58,123,168,.18);color:#5BA3CC}
.role-chip.staff{background:rgba(255,255,255,.06);color:var(--muted)}
.role-chip.chicha{background:rgba(255,120,0,.15);color:#FF7A00}
.role-chip.achats{background:rgba(140,80,220,.15);color:#B080F0}
.emp-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:2px}
.emp-dot.on{background:var(--ok)}
.emp-dot.off{background:var(--danger)}
.emp-dot.none{background:var(--bg4);border:1px solid var(--muted)}
.emp-actions{display:flex;flex-direction:column;gap:3px;align-items:flex-end;flex-shrink:0}
.emp-btn{font-size:11px;background:none;border:none;cursor:pointer;padding:2px 0;text-align:right}
  </style>
</head>
<body>
  <div id="__header__"></div>
  <div class="body-wrap">

    <!-- Nom du gestionnaire -->
    <div class="card">
      <div class="card-head"><div class="card-title">Votre nom affiché</div></div>
      <div class="card-body">
        <div class="field">
          <label>Nom dans votre badge</label>
          <input id="owner-nom" type="text" placeholder="Ex: Mohamed Lamine Savane">
        </div>
        <button class="btn-primary" onclick="saveOwnerNom()">ENREGISTRER</button>
      </div>
    </div>

    <!-- Objectif journalier -->
    <div class="card">
      <div class="card-head"><div class="card-title">Objectif journalier</div></div>
      <div class="card-body">
        <div class="field">
          <label>Net minimum par jour (GNF)</label>
          <input id="obj-val" type="number" inputmode="numeric" placeholder="Ex: 500000">
        </div>
        <button class="btn-primary" onclick="saveObjectif()">ENREGISTRER</button>
      </div>
    </div>

    <!-- Note pour le Manager -->
    <div class="card">
      <div class="card-head"><div class="card-title">Note pour le Manager</div></div>
      <div class="card-body">
        <div class="field">
          <label>Message visible par le Manager en arrivant</label>
          <textarea id="note-manager" rows="3" placeholder="Ex: Vérifiez les stocks chicha, ouverture à 19h…"
            style="resize:vertical;min-height:70px"></textarea>
        </div>
        <button class="btn-primary" onclick="saveNoteManager()">ENREGISTRER</button>
      </div>
    </div>

    <!-- Changement PINs -->
    <div class="card">
      <div class="card-head"><div class="card-title">Changer les PINs</div></div>
      <div class="card-body" style="gap:8px" id="pin-sections"></div>
    </div>

    <!-- Associés -->
    <div class="card">
      <div class="card-head">
        <div class="card-title">Associés</div>
        <button class="btn-secondary" onclick="openAddAssoc()">+ Ajouter</button>
      </div>
      <div class="card-body" id="assoc-list">
        <div class="state-msg">Chargement…</div>
      </div>
    </div>

    <!-- Comptes Employés -->
    <div class="card">
      <div class="card-head">
        <div class="card-title">Comptes Employés</div>
        <button class="btn-secondary" onclick="openEmpModal('create')">+ Créer</button>
      </div>
      <div class="card-body" id="employe-list">
        <div class="state-msg">Chargement…</div>
      </div>
    </div>

    <!-- Journal de connexion -->
    <div class="card">
      <div class="card-head">
        <div class="card-title">Journal de connexion</div>
        <div class="card-sub">20 dernières</div>
      </div>
      <div class="card-body" id="logs-list">
        <div class="state-msg">Chargement…</div>
      </div>
    </div>

  </div>
  <!-- Modal ajout associé -->
  <div id="overlay-assoc" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);
    z-index:100;display:none;align-items:flex-end;justify-content:center">
    <div class="sheet" style="width:100%;max-width:480px;padding:24px 20px 32px">
      <div class="sheet-title" id="assoc-modal-title">Nouvel associé</div>
      <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:16px">
        <div class="field"><label>Nom</label>
          <input id="as-nom" type="text" placeholder="Prénom Nom"></div>
        <div class="row2">
          <div class="field"><label>Part (%)</label>
            <input id="as-pct" type="number" inputmode="decimal" placeholder="10" min="0" max="100" step="0.5"></div>
          <div class="field"><label>PIN (4 chiffres)</label>
            <input id="as-pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>
        </div>
        <div class="field"><label>Confirmer le PIN</label>
          <input id="as-pin2" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>
        <div id="as-err" style="font-size:13px;color:var(--danger);min-height:14px"></div>
      </div>
      <div class="sheet-btns">
        <button class="btn-cancel" onclick="closeAssocModal()">Annuler</button>
        <button class="btn-ok" onclick="saveAssoc()">ENREGISTRER</button>
      </div>
    </div>
  </div>
  <!-- Modal compte employé -->
  <div id="overlay-employe" style="display:none;position:fixed;inset:0;
    background:rgba(0,0,0,.85);z-index:100;align-items:flex-end;justify-content:center">
    <div class="sheet" style="width:100%;max-width:480px;padding:24px 20px 32px">
      <div class="sheet-title" id="emp-modal-title">Nouveau compte employé</div>
      <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:16px">
        <div class="row2" id="em-name-row">
          <div class="field"><label>Prénom</label>
            <input id="em-prenom" type="text" placeholder="Prénom"></div>
          <div class="field"><label>Nom</label>
            <input id="em-nom" type="text" placeholder="Nom"></div>
        </div>
        <div class="field" id="em-poste-field"><label>Poste</label>
          <input id="em-poste" type="text" placeholder="Ex: Serveur, Caissier…"></div>
        <div class="field" id="em-role-field"><label>Rôle &amp; accès</label>
          <select id="em-role">
            <option value="staff">Staff — Saisie ventes + historique perso</option>
            <option value="caissier">Caissier — Gestion caisse + validation</option>
            <option value="chicha">Chicha — Suivi sorties chichas + aromes</option>
            <option value="achats">Achats — Enregistrement achats + stocks</option>
            <option value="manager">Manager — Dashboard, RH, Produits…</option>
          </select>
        </div>
        <div class="row2">
          <div class="field"><label>PIN (4 chiffres)</label>
            <input id="em-pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>
          <div class="field"><label>Confirmer PIN</label>
            <input id="em-pin2" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>
        </div>
        <div id="em-err" style="font-size:13px;color:var(--danger);min-height:14px"></div>
      </div>
      <div class="sheet-btns">
        <button class="btn-cancel" onclick="closeEmpModal()">Annuler</button>
        <button class="btn-ok" onclick="saveEmploye()">ENREGISTRER</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

<script>
const H_STAFF_DEF   = '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';
const H_MANAGER_DEF = 'b8dc2c143be8994682b08461f46487e05874e59dd9ab65cf973e3a3c67a763aa';

let hOwner=null, hStaff=H_STAFF_DEF, hManager=H_MANAGER_DEF;
let pcTarget=null, pcStep=0, pcBufs=['','',''];

document.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('__header__').outerHTML = HEADER_HTML;
  if (!initPage(['owner'])) return;
  buildPinSections();
  await loadConfig();
  loadLogs();
  loadAssocs();
  loadEmployeComptes();
});

function buildPinSections() {
  const targets = [
    { id:'owner',   label:'PIN Gestionnaire' },
    { id:'manager', label:'PIN Manager' },
  ];
  const keys = [1,2,3,4,5,6,7,8,9,'void',0,'del'];

  document.getElementById('pin-sections').innerHTML = targets.map(t => `
    <div>
      <button class="btn-secondary" style="width:100%;text-align:left"
        onclick="togglePc('${t.id}')">${t.label}</button>
      <div class="pc-body" id="pcb-${t.id}">
        <div class="pc-hint" id="pch-${t.id}">Entrez votre PIN actuel</div>
        <div class="pc-dots" id="pcd-${t.id}">
          <div class="pc-dot" id="pcd-${t.id}-0"></div>
          <div class="pc-dot" id="pcd-${t.id}-1"></div>
          <div class="pc-dot" id="pcd-${t.id}-2"></div>
          <div class="pc-dot" id="pcd-${t.id}-3"></div>
        </div>
        <div class="pc-err" id="pce-${t.id}"></div>
        <div class="pc-keypad">
          ${keys.map(k => {
            if (k==='void') return `<div class="pc-key void"></div>`;
            if (k==='del')  return `<div class="pc-key del" onclick="pcKey('${t.id}','del')">⌫</div>`;
            return `<div class="pc-key" onclick="pcKey('${t.id}','${k}')">${k}</div>`;
          }).join('')}
        </div>
      </div>
    </div>`).join('');
}

async function loadConfig() {
  try {
    const { data } = await db.from('config').select('key,value');
    const cfg = {};
    (data||[]).forEach(r => cfg[r.key]=r.value);
    hOwner   = cfg.pin_owner   || null;
    hStaff   = cfg.pin_staff   || H_STAFF_DEF;
    hManager = cfg.pin_manager || H_MANAGER_DEF;
    if (cfg.owner_nom)           $('owner-nom').value   = cfg.owner_nom;
    if (cfg.objectif_journalier) $('obj-val').value     = cfg.objectif_journalier;
    if (cfg.note_manager !== undefined) $('note-manager').value = cfg.note_manager || '';
  } catch {}
}

async function saveOwnerNom() {
  const val = ($('owner-nom')?.value || '').trim();
  if (!val) { toast('Nom requis', 'ko'); return; }
  try {
    await db.from('config').upsert({ key:'owner_nom', value:val });
    toast('Nom mis à jour ✓', 'ok');
  } catch(e) { toast('Erreur : '+e.message, 'ko'); }
}

async function saveNoteManager() {
  const val = ($('note-manager').value || '').trim();
  try {
    const { data: existing } = await db.from('config').select('key').eq('key','note_manager');
    if (existing?.length) {
      await db.from('config').update({value: val}).eq('key','note_manager');
    } else {
      await db.from('config').insert({key:'note_manager', value: val});
    }
    toast('Note enregistrée ✓','ok');
  } catch(e) { toast('Erreur : '+e.message,'ko'); }
}

async function saveObjectif() {
  const val = parseFloat($('obj-val').value);
  if (!val||val<0) { toast('Valeur invalide','ko'); return; }
  try {
    await db.from('config').upsert({key:'objectif_journalier',value:String(val)});
    toast('Objectif enregistré ✓','ok');
  } catch(e) { toast('Erreur','ko'); }
}

async function loadLogs() {
  try {
    const { data } = await db.from('logs').select('*')
      .order('timestamp',{ascending:false}).limit(50);
    const list = data || [];
    if (!list.length) {
      $('logs-list').innerHTML = '<div class="state-msg">Aucune activité enregistrée.</div>'; return;
    }

    const ROLE_LABEL = { owner:'Gestionnaire', manager:'Manager', associe:'Associé', staff:'Staff' };
    const isActivity = a => a && a !== 'login' && /[📋✅❌📦💰⚠🔒]/u.test(a);

    $('logs-list').innerHTML = list.map(l => {
      const d       = new Date(l.timestamp);
      const dateStr = d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
      const timeStr = d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
      const role    = ROLE_LABEL[l.role] || l.role;
      const activ   = isActivity(l.action);

      if (activ) {
        return `<div class="log-item" style="flex-direction:column;align-items:flex-start;gap:3px;
            background:rgba(201,168,76,.05);border-radius:8px;padding:9px 12px;
            border:1px solid rgba(201,168,76,.12)">
          <div style="font-size:13px;font-weight:500;line-height:1.4">${l.action}</div>
          <div class="log-ts">
            <span style="color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:.5px">${role}</span>
            · ${dateStr} à ${timeStr}
          </div>
        </div>`;
      }

      const who = l.action && l.action !== 'login' ? l.action : role;
      return `<div class="log-item">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:15px;opacity:.5">🔑</span>
          <div>
            <div class="log-role">${who}</div>
            <div class="log-ts">${dateStr} à ${timeStr}</div>
          </div>
        </div>
      </div>`;
    }).join('');
  } catch(e) {
    $('logs-list').innerHTML = `<div class="state-msg err">${e.message}</div>`;
  }
}

/* ── ASSOCIÉS ── */
async function loadAssocs() {
  try {
    const { data } = await db.from('associes').select('*').order('nom');
    const list = data || [];
    if (!list.length) {
      $('assoc-list').innerHTML = '<div class="state-msg">Aucun associé.</div>'; return;
    }
    $('assoc-list').innerHTML = list.map(a => `
      <div class="assoc-item">
        <div>
          <div class="assoc-nom">${a.nom}</div>
          <div class="assoc-info">${a.actif ? 'Actif' : 'Inactif'}</div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <div class="assoc-pct">${a.pourcentage}%</div>
          <button style="font-size:11px;color:var(--danger);background:none;
            border:none;cursor:pointer" onclick="archiveAssoc('${a.id}','${a.nom}')">
            ${a.actif ? 'Désactiver' : 'Réactiver'}
          </button>
        </div>
      </div>`).join('');
  } catch(e) {
    $('assoc-list').innerHTML = `<div class="state-msg err">Table "associes" manquante — créez-la dans Supabase.</div>`;
  }
}

function openAddAssoc() {
  $('as-nom').value  = '';
  $('as-pct').value  = '';
  $('as-pin').value  = '';
  $('as-pin2').value = '';
  $('as-err').textContent = '';
  const ov = $('overlay-assoc');
  ov.style.display = 'flex';
}

function closeAssocModal() {
  $('overlay-assoc').style.display = 'none';
}

async function saveAssoc() {
  const nom = $('as-nom').value.trim();
  const pct = parseFloat($('as-pct').value);
  const pin = $('as-pin').value.trim();
  const pin2= $('as-pin2').value.trim();

  if (!nom)            { $('as-err').textContent = 'Le nom est requis'; return; }
  if (isNaN(pct)||pct<0||pct>100) { $('as-err').textContent = 'Pourcentage invalide (0–100)'; return; }
  if (pin.length !== 4 || !/^\d{4}$/.test(pin)) { $('as-err').textContent = 'PIN : 4 chiffres requis'; return; }
  if (pin !== pin2)    { $('as-err').textContent = 'Les PINs ne correspondent pas'; return; }

  /* Vérifier conflit avec PINs existants */
  const hNew = await sha256(pin);
  if (hNew === hOwner || hNew === hStaff || hNew === hManager) {
    $('as-err').textContent = 'Ce PIN est déjà utilisé par un autre rôle'; return;
  }

  try {
    await db.from('associes').insert({ nom, pourcentage:pct, pin_hash:hNew });
    toast('Associé ajouté ✓','ok');
    closeAssocModal();
    loadAssocs();
  } catch(e) { $('as-err').textContent = 'Erreur : '+e.message; }
}

async function archiveAssoc(id, nom) {
  const { data: cur } = await db.from('associes').select('actif').eq('id',id).single();
  const newState = !cur?.actif;
  try {
    await db.from('associes').update({actif:newState}).eq('id',id);
    toast(`${nom} ${newState?'réactivé':'désactivé'} ✓`, 'ok');
    loadAssocs();
  } catch(e) { toast('Erreur','ko'); }
}

/* ── COMPTES EMPLOYÉS ── */
let _empMode = 'create', _empId = null;

async function loadEmployeComptes() {
  try {
    const { data } = await db.from('employes')
      .select('id,nom,prenom,poste,actif,pin_hash,role').order('nom');
    const list = data || [];
    if (!list.length) {
      $('employe-list').innerHTML = '<div class="state-msg">Aucun employé. Créez un compte.</div>'; return;
    }
    $('employe-list').innerHTML = list.map(e => {
      const hasAcc  = !!e.pin_hash;
      const dotCls  = !hasAcc ? 'none' : e.actif ? 'on' : 'off';
      const statusTxt = !hasAcc ? 'Sans compte' : e.actif ? 'Actif' : 'Inactif';
      const ROLE_LBL      = { staff:'Staff', caissier:'Caissier', chicha:'Chicha', achats:'Achats', manager:'Manager' };
      const ROLE_NEXT     = { staff:'caissier', caissier:'chicha', chicha:'achats', achats:'manager', manager:'staff' };
      const ROLE_NEXT_LBL = { staff:'Caissier', caissier:'Chicha', chicha:'Achats', achats:'Manager', manager:'Staff' };
      const curRole   = e.role || 'staff';
      const roleLbl   = ROLE_LBL[curRole] || 'Staff';
      const nomComplet = [e.prenom, e.nom].filter(Boolean).join(' ');
      return `
        <div class="emp-item">
          <div style="display:flex;gap:10px;align-items:flex-start;flex:1;min-width:0">
            <div class="emp-dot ${dotCls}" style="margin-top:5px"></div>
            <div>
              <div class="emp-nom">${nomComplet}</div>
              <div class="emp-meta">
                <span>${e.poste||'—'}</span>
                ${hasAcc?`<span class="role-chip ${curRole}">${roleLbl}</span>`:''}
                <span style="color:${e.actif&&hasAcc?'var(--ok)':hasAcc?'var(--danger)':'var(--muted)'}">${statusTxt}</span>
              </div>
            </div>
          </div>
          <div class="emp-actions">
            ${hasAcc ? `
              <button class="emp-btn" style="color:${e.actif?'var(--danger)':'var(--ok)'}"
                onclick="toggleEmpAcces('${e.id}','${nomComplet}',${e.actif})">
                ${e.actif?'Désactiver':'Réactiver'}
              </button>
              <button class="emp-btn" style="color:var(--muted)"
                onclick="openEmpModal('reset','${e.id}','${nomComplet}')">
                Reset PIN
              </button>
              <button class="emp-btn" style="color:var(--gold)"
                onclick="toggleRole('${e.id}','${curRole}','${nomComplet}')">
                → ${ROLE_NEXT_LBL[curRole]||'Caissier'}
              </button>
            ` : `
              <button class="emp-btn" style="color:var(--ok)"
                onclick="openEmpModal('access','${e.id}','${nomComplet}')">
                Donner accès
              </button>
            `}
          </div>
        </div>`;
    }).join('');
  } catch(e) {
    $('employe-list').innerHTML = `<div class="state-msg err">Erreur : ${e.message}</div>`;
  }
}

function openEmpModal(mode, id = null, nomComplet = '') {
  _empMode = mode;
  _empId   = id;
  $('em-err').textContent = '';
  $('em-pin').value  = '';
  $('em-pin2').value = '';

  const nameRow   = $('em-name-row');
  const posteField = $('em-poste-field');
  const roleField  = $('em-role-field');

  if (mode === 'create') {
    $('emp-modal-title').textContent = 'Nouveau compte employé';
    $('em-prenom').value = ''; $('em-nom').value = '';
    $('em-poste').value  = ''; $('em-role').value = 'staff';
    nameRow.style.display = ''; posteField.style.display = '';
    roleField.style.display = '';
    $('em-prenom').disabled = false; $('em-nom').disabled = false;

  } else if (mode === 'access') {
    $('emp-modal-title').textContent = `Donner accès — ${nomComplet}`;
    $('em-prenom').value = ''; $('em-nom').value = nomComplet;
    $('em-role').value = 'staff';
    nameRow.style.display = 'none'; posteField.style.display = 'none';
    roleField.style.display = '';

  } else if (mode === 'reset') {
    $('emp-modal-title').textContent = `Nouveau PIN — ${nomComplet}`;
    nameRow.style.display = 'none'; posteField.style.display = 'none';
    roleField.style.display = 'none';
  }

  $('overlay-employe').style.display = 'flex';
}

function closeEmpModal() {
  $('overlay-employe').style.display = 'none';
  $('em-name-row').style.display    = '';
  $('em-poste-field').style.display = '';
  $('em-role-field').style.display  = '';
}

async function saveEmploye() {
  const pin  = $('em-pin').value.trim();
  const pin2 = $('em-pin2').value.trim();

  if (pin.length !== 4 || !/^\d{4}$/.test(pin)) {
    $('em-err').textContent = 'PIN : 4 chiffres requis'; return;
  }
  if (pin !== pin2) {
    $('em-err').textContent = 'Les PINs ne correspondent pas'; return;
  }

  const hNew = await sha256(pin);

  /* Conflits PINs */
  if (hNew === hOwner || hNew === hManager) {
    $('em-err').textContent = 'Ce PIN est déjà utilisé par un autre rôle'; return;
  }
  const { data: aConf } = await db.from('associes').select('id').eq('pin_hash', hNew);
  if (aConf?.length) { $('em-err').textContent = 'Ce PIN est déjà utilisé par un associé'; return; }

  const eQuery = db.from('employes').select('id').eq('pin_hash', hNew);
  if (_empId) eQuery.neq('id', _empId);
  const { data: eConf } = await eQuery;
  if (eConf?.length) { $('em-err').textContent = 'Ce PIN est déjà utilisé par un autre employé'; return; }

  try {
    if (_empMode === 'create') {
      const nom    = $('em-nom').value.trim();
      const prenom = $('em-prenom').value.trim();
      if (!nom) { $('em-err').textContent = 'Le nom est requis'; return; }
      await db.from('employes').insert({
        nom, prenom,
        poste:    $('em-poste').value.trim() || null,
        role:     $('em-role').value,
        pin_hash: hNew, actif: true
      });
    } else if (_empMode === 'access') {
      await db.from('employes').update({
        pin_hash: hNew, actif: true, role: $('em-role').value
      }).eq('id', _empId);
    } else if (_empMode === 'reset') {
      await db.from('employes').update({ pin_hash: hNew }).eq('id', _empId);
    }
    toast('Enregistré ✓', 'ok');
    closeEmpModal();
    loadEmployeComptes();
  } catch(e) { $('em-err').textContent = 'Erreur : ' + e.message; }
}

async function toggleEmpAcces(id, nom, currentActif) {
  try {
    await db.from('employes').update({ actif: !currentActif }).eq('id', id);
    toast(`${nom} ${!currentActif ? 'réactivé' : 'désactivé'} ✓`, 'ok');
    loadEmployeComptes();
  } catch { toast('Erreur', 'ko'); }
}

async function toggleRole(id, currentRole, nom) {
  const cycle = { staff:'caissier', caissier:'chicha', chicha:'achats', achats:'manager', manager:'staff' };
  const newRole = cycle[currentRole] || 'caissier';
  try {
    await db.from('employes').update({ role: newRole }).eq('id', id);
    const lbl = { staff:'Staff', caissier:'Caissier', chicha:'Chicha', achats:'Achats', manager:'Manager' };
    toast(`${nom} → ${lbl[newRole]} ✓`, 'ok');
    loadEmployeComptes();
  } catch { toast('Erreur', 'ko'); }
}

/* ── PIN CHANGE ── */
function togglePc(target) {
  const body = $('pcb-'+target);
  const isOpen = body?.classList.contains('open');
  ['owner','manager','staff'].forEach(t => $('pcb-'+t)?.classList.remove('open'));
  if (!isOpen) {
    body?.classList.add('open');
    pcTarget = target;
    pcStep   = target==='owner' ? 0 : 1;
    pcBufs   = ['','',''];
    updatePcHint(); renderPcDots();
    $('pce-'+target).textContent = '';
  }
}

function pcKey(target, k) {
  if (pcTarget!==target) { pcTarget=target; }
  if (k==='del') {
    pcBufs[pcStep] = pcBufs[pcStep].slice(0,-1);
  } else {
    if (pcBufs[pcStep].length>=4) return;
    pcBufs[pcStep] += k;
    if (pcBufs[pcStep].length===4) setTimeout(()=>pcNext(), 150);
  }
  renderPcDots();
}

function renderPcDots() {
  for (let i=0;i<4;i++)
    $('pcd-'+pcTarget+'-'+i)?.classList.toggle('on', i<pcBufs[pcStep].length);
}

function updatePcHint() {
  const hints = {
    owner:   ['Entrez votre PIN actuel','Nouveau PIN Gestionnaire','Confirmez le nouveau PIN'],
    manager: ['','Nouveau PIN Manager','Confirmez'],
  };
  const $h = $('pch-'+pcTarget);
  if ($h) $h.textContent = hints[pcTarget][pcStep]||'';
}

async function pcNext() {
  const h = await sha256(pcBufs[pcStep]);
  $('pce-'+pcTarget).textContent = '';

  if (pcTarget==='owner' && pcStep===0) {
    if (h!==hOwner) {
      $('pce-'+pcTarget).textContent = 'PIN incorrect';
      pcBufs[0]=''; renderPcDots(); return;
    }
    pcStep=1; pcBufs[1]=''; renderPcDots(); updatePcHint(); return;
  }

  if (pcStep===1) {
    const conflict = (pcTarget!=='staff'&&h===hStaff)||(pcTarget!=='manager'&&h===hManager)||(pcTarget!=='owner'&&h===hOwner);
    if (conflict) {
      $('pce-'+pcTarget).textContent = 'Ce PIN est déjà utilisé';
      pcBufs[1]=''; renderPcDots(); return;
    }
    pcStep=2; pcBufs[2]=''; renderPcDots(); updatePcHint(); return;
  }

  if (pcStep===2) {
    const hNew = await sha256(pcBufs[1]);
    if (h!==hNew) {
      $('pce-'+pcTarget).textContent = 'Les codes ne correspondent pas';
      pcStep=1; pcBufs[1]=''; renderPcDots(); updatePcHint(); return;
    }
    try {
      await db.from('config').upsert({key:'pin_'+pcTarget, value:hNew});
      if (pcTarget==='owner')   hOwner   = hNew;
      if (pcTarget==='staff')   hStaff   = hNew;
      if (pcTarget==='manager') hManager = hNew;
      toast('PIN mis à jour ✓','ok');
      togglePc(pcTarget);
    } catch(e) {
      $('pce-'+pcTarget).textContent = 'Erreur : '+e.message;
      pcStep=1; pcBufs[1]=''; renderPcDots(); updatePcHint();
    }
  }
}
</script>
