<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Saisie — Medellin Lounge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="shared.js" defer></script>
  <style>

/* ── Type tabs ── */
.type-tabs{display:flex;gap:6px;margin-bottom:12px}
.type-btn{
  flex:1;padding:11px 4px;border-radius:var(--rs);border:1px solid var(--b1);
  background:transparent;color:var(--muted);font-size:12px;font-weight:600;
  letter-spacing:.8px;text-transform:uppercase;cursor:pointer;transition:all var(--t);
  -webkit-tap-highlight-color:transparent}
.type-btn.active{color:#060606;border-color:transparent}
.type-btn[data-t="chicha"].active{background:var(--gold)}
.type-btn[data-t="boisson"].active{background:#3A7BA8;color:#fff}
.type-btn[data-t="autre"].active{background:var(--ok);color:#060606}

/* ── Product grid ── */
.prod-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  margin-bottom:4px}
@media(min-width:480px){.prod-grid{grid-template-columns:1fr 1fr 1fr}}
.prod-card{
  appearance:none;-webkit-appearance:none;
  font-family:inherit;font-size:inherit;text-align:left;width:100%;
  background:var(--bg2);border:1.5px solid var(--b1);border-radius:var(--r);
  padding:14px 12px;cursor:pointer;transition:all var(--t);
  -webkit-tap-highlight-color:transparent;
  display:flex;flex-direction:column;gap:4px;
  min-height:72px;justify-content:center;
  position:relative;overflow:hidden}
.prod-card:active{transform:scale(.97);opacity:.85}
.prod-card.selected{border-color:var(--gold);background:rgba(201,168,76,.10)}
.prod-card-nom{font-size:14px;font-weight:600;line-height:1.3;color:var(--text)}
.prod-card-prix{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--gold)}
.prod-card.chicha .prod-card-prix{color:var(--gold)}
.prod-card.boisson .prod-card-prix{color:#3A7BA8}
.prod-card.autre   .prod-card-prix{color:var(--ok)}
.prod-card.no-prix .prod-card-prix{color:var(--muted);font-size:13px}
.prod-card-badge{
  position:absolute;top:6px;right:6px;
  font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;letter-spacing:.3px}
.prod-card-badge.chicha{background:rgba(201,168,76,.15);color:var(--gold)}
.prod-card-badge.boisson{background:rgba(58,123,168,.15);color:#3A7BA8}
.prod-card-badge.autre{background:rgba(61,184,115,.15);color:var(--ok)}

/* ── Bottom sheet confirm ── */
.confirm-sheet{
  background:var(--bg2);border-radius:20px 20px 0 0;
  padding:20px 16px 32px;border-top:1px solid var(--b1)}
.confirm-title{font-family:'Bebas Neue',sans-serif;font-size:22px;
  letter-spacing:2px;color:var(--text);margin-bottom:2px}
.confirm-prix-unit{font-size:12px;color:var(--muted);margin-bottom:20px}

/* Stepper quantité */
.qty-stepper{
  display:flex;align-items:center;justify-content:center;
  gap:0;background:var(--bg3);border-radius:var(--r);
  border:1px solid var(--b1);overflow:hidden;margin-bottom:16px}
.qty-btn{
  width:56px;height:56px;background:transparent;border:none;
  font-size:26px;color:var(--text);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;transition:background var(--t)}
.qty-btn:active{background:var(--b1)}
.qty-val{
  flex:1;text-align:center;font-family:'Bebas Neue',sans-serif;
  font-size:36px;color:var(--gold);
  background:transparent;border:none;border-left:1px solid var(--b1);
  border-right:1px solid var(--b1);outline:none;
  min-width:0;height:56px;line-height:56px;padding:0}
.qty-val::-webkit-inner-spin-button,
.qty-val::-webkit-outer-spin-button{-webkit-appearance:none}

/* Total preview */
.confirm-total{
  display:flex;justify-content:space-between;align-items:center;
  background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);
  border-radius:var(--rs);padding:12px 14px;margin-bottom:14px}
.confirm-total-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.confirm-total-val{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--gold)}

/* Paiement toggle */
.pay-tabs{display:flex;gap:8px;margin-bottom:16px}
.pay-btn{
  flex:1;padding:12px 6px;border-radius:var(--rs);border:1px solid var(--b1);
  background:transparent;color:var(--muted);font-size:13px;font-weight:600;
  cursor:pointer;transition:all var(--t);-webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;justify-content:center;gap:5px}
.pay-btn.active.especes{background:rgba(61,184,115,.15);border-color:rgba(61,184,115,.4);color:var(--ok)}
.pay-btn.active.om{background:rgba(255,120,0,.15);border-color:rgba(255,120,0,.4);color:#FF7800}

/* Prix custom */
.prix-custom-wrap{margin-bottom:16px}
.prix-custom-label{font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.7px}
.prix-custom-input{
  width:100%;background:var(--bg3);border:1px solid var(--b1);border-radius:var(--rs);
  padding:12px 14px;font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gold);
  text-align:right;outline:none;box-sizing:border-box}
.prix-custom-input:focus{border-color:var(--gold)}

/* ── Ventes list ── */
.vente-item{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;
  background:var(--bg2);border-radius:var(--r);
  border:1px solid var(--b1)}
.vente-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.vente-dot.chicha{background:var(--gold)}
.vente-dot.boisson{background:#3A7BA8}
.vente-dot.autre{background:var(--ok)}
.vente-info{flex:1;min-width:0}
.vente-label{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vente-meta{font-size:11px;color:var(--muted);margin-top:1px}
.pay-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;flex-shrink:0;letter-spacing:.5px}
.pay-badge.especes{background:rgba(61,184,115,.12);color:var(--ok);border:1px solid rgba(61,184,115,.2)}
.pay-badge.om{background:rgba(255,120,0,.12);color:#FF7800;border:1px solid rgba(255,120,0,.2)}
.vente-total{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--gold);white-space:nowrap;flex-shrink:0}
.vente-del{
  width:36px;height:36px;flex-shrink:0;border-radius:8px;
  background:var(--bg3);border:1px solid var(--b1);
  color:var(--muted);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;transition:all var(--t)}
.vente-del:active{background:rgba(217,84,84,.2);color:var(--danger);border-color:var(--danger)}

/* ── Total bar ── */
.total-bar{
  background:var(--glow);border:1px solid var(--gring);border-radius:var(--r);
  padding:14px 16px}
.total-bar-row{display:flex;justify-content:space-between;align-items:center;
  font-size:12px;color:var(--muted);margin-bottom:6px}
.total-bar-row:last-child{margin-bottom:0}
.total-bar-main{display:flex;justify-content:space-between;align-items:baseline;
  padding-top:10px;margin-top:6px;border-top:1px solid var(--gring)}
.total-bar-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px}
.total-bar-val{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--gold);line-height:1}

/* ── Close CTA ── */
.close-cta{
  background:linear-gradient(180deg,var(--goldl) 0%,var(--gold) 100%);
  border:none;border-radius:var(--r);padding:18px;width:100%;
  font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;
  color:#060606;cursor:pointer;
  box-shadow:0 4px 24px rgba(201,168,76,.28),0 1px 0 rgba(255,255,255,.15) inset;
  transition:opacity var(--t),transform var(--t);
  -webkit-tap-highlight-color:transparent}
.close-cta:active{opacity:.85;transform:scale(.99)}
.close-cta:disabled{opacity:.25;cursor:not-allowed;box-shadow:none}

/* ── Closed state ── */
.session-done{
  background:var(--okbg);border:1px solid var(--okb);
  border-radius:var(--r);padding:24px;text-align:center}
.session-done-icon{font-size:36px;margin-bottom:10px}
.session-done-title{font-family:'Bebas Neue',sans-serif;font-size:22px;
  letter-spacing:2px;color:var(--ok);margin-bottom:6px}
.session-done-sub{font-size:13px;color:var(--muted);line-height:1.6}

/* ── Session banner ── */
.sess-banner{
  display:flex;align-items:center;gap:10px;
  background:var(--bg2);border:1px solid var(--b1);
  border-radius:var(--r);padding:12px 16px}
.sess-date{font-size:15px;font-weight:600}
.sess-meta{font-size:12px;color:var(--muted);margin-top:1px}

/* ── Empty hint ── */
.grid-empty{
  grid-column:1/-1;text-align:center;
  padding:28px 16px;color:var(--muted);font-size:13px}

/* ── Notes ── */
.notes-card{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r);padding:14px}
.notes-area{
  width:100%;background:transparent;border:none;resize:none;
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;
  line-height:1.6;outline:none;min-height:80px}
.notes-area::placeholder{color:var(--muted)}
.notes-status{font-size:11px;color:var(--muted);margin-top:6px;text-align:right;min-height:14px}

  </style>
</head>
<body>
  <div id="__header__"></div>
  <div class="body-wrap" id="main-body">
    <div class="state-msg">Chargement…</div>
  </div>
  <div id="overlay"><div class="sheet" id="overlay-sheet"></div></div>
  <div id="toast"></div>

<script>
let sessionId     = null;
let sessionStatut = 'ouvert';
let empId         = null;
let empNom        = '';
let produits      = [];
let ventes        = [];
let closed        = false;
let activeType    = 'chicha';
let paiement      = 'especes';
let selectedProd  = null;
let _savingVente  = false;
let _noteSave;

const noteKey = () => `ml_note_${empId}_${todayISO()}`;

document.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('__header__').outerHTML = HEADER_HTML;
  if (!initPage(['staff'])) return;

  const extra = ML.getExtra();
  empId  = extra.employe_id || null;
  empNom = extra.nom || 'Staff';

  if (!empId) {
    $('main-body').innerHTML = '<div class="state-msg err">Compte employé non configuré.</div>';
    return;
  }

  const [, sessionOk] = await Promise.all([loadProduits(), initSession()]);
  if (sessionOk !== false) {
    renderPage();
    subscribeRealtime();
  }
});

async function loadProduits() {
  try {
    const { data, error } = await db.from('produits')
      .select('nom,type,prix_defaut')
      .not('actif', 'is', false)
      .order('nom');
    if (error) {
      console.error('produits:', error.message);
      toast('Erreur chargement produits : ' + error.message, 'ko');
    }
    produits = (data || []).map(p => ({
      ...p,
      prix: p.prix_defaut || 0
    }));
    /* Par défaut on s'aligne sur le premier type disponible */
    const types = [...new Set(produits.map(p => p.type||'autre'))];
    if (types.includes('chicha'))       activeType = 'chicha';
    else if (types.includes('boisson')) activeType = 'boisson';
    else if (types.length)              activeType = types[0];
  } catch {}
}

async function initSession() {
  const today = todayISO();
  try {
    let { data: existing } = await db
      .from('sessions_caisse').select('id,statut').eq('date', today).maybeSingle();

    if (!existing) {
      const { data: created, error } = await db
        .from('sessions_caisse').insert({ date: today, statut:'ouvert' }).select().single();
      if (error) {
        /* Session créée en parallèle par un autre rôle (date UNIQUE) → on relit */
        const { data: again } = await db
          .from('sessions_caisse').select('id,statut').eq('date', today).maybeSingle();
        if (!again) throw error;
        existing = again;
      } else {
        existing = created;
      }
    }
    sessionId     = existing.id;
    sessionStatut = existing.statut || 'ouvert';

    const { data: myVentes } = await db
      .from('ventes_session').select('*')
      .eq('session_id', sessionId).eq('employe_id', empId).order('created_at');

    ventes = myVentes || [];
    closed = ventes.length > 0 && ventes.every(v => v.valide_staff);
    return true;

  } catch(e) {
    $('main-body').innerHTML = `<div class="state-msg err">Erreur : ${e.message}</div>`;
    return false;
  }
}

function subscribeRealtime() {
  if (!sessionId) return;
  const ch = db.channel('ml-saisie-' + empId);
  ch.on('postgres_changes', {
    event: '*', schema: 'public', table: 'ventes_session',
    filter: `session_id=eq.${sessionId}`
  }, async () => {
    const { data } = await db.from('ventes_session').select('*')
      .eq('session_id', sessionId).eq('employe_id', empId).order('created_at');
    ventes = data || [];
    closed = ventes.length > 0 && ventes.every(v => v.valide_staff);
    renderPage();
  });
  ch.on('postgres_changes', {
    event: 'UPDATE', schema: 'public', table: 'sessions_caisse',
    filter: `id=eq.${sessionId}`
  }, payload => {
    sessionStatut = payload.new?.statut || sessionStatut;
    renderPage();
  });
  ch.subscribe();
}

/* ════════════════════════════════════════════
   RENDER
════════════════════════════════════════════ */
function renderPage() {
  const today     = todayISO();
  const total     = ventes.reduce((s, v) => s + (v.total || 0), 0);
  const totOM     = ventes.filter(v => v.paiement === 'om').reduce((s,v) => s+v.total, 0);
  const totEsp    = total - totOM;
  const sessLocked = sessionStatut === 'valide_caissier' || sessionStatut === 'valide_manager';

  const banner = `
    <div class="sess-banner">
      <div style="flex:1">
        <div class="sess-date">${frDate(today)}</div>
        <div class="sess-meta">${escHtml(empNom)}</div>
      </div>
      <span class="badge ${sessLocked ? 'ko' : closed ? 'ok' : 'gold'}">
        ${sessLocked ? 'Validée caisse' : closed ? 'Envoyée' : 'En service'}
      </span>
    </div>`;

  /* Session clôturée par la caissière — lecture seule */
  if (sessLocked) {
    $('main-body').innerHTML = banner + `
      <div class="session-done" style="border-color:rgba(217,84,84,.3);background:rgba(217,84,84,.06)">
        <div class="session-done-icon">🔒</div>
        <div class="session-done-title" style="color:var(--danger)">Session clôturée</div>
        <div class="session-done-sub">
          La caissière a validé la session — aucune modification possible.<br>
          ${ventes.length ? `Tes ventes : <strong style="color:var(--gold)">${gnf(total)}</strong>` : 'Aucune vente enregistrée.'}
        </div>
      </div>
      ${renderVentesList(false)}
      ${renderNotes()}`;
    initNotes();
    return;
  }

  if (closed) {
    $('main-body').innerHTML = banner + `
      <div class="session-done">
        <div class="session-done-icon">✓</div>
        <div class="session-done-title">Saisie envoyée</div>
        <div class="session-done-sub">
          ${ventes.length} vente${ventes.length>1?'s':''} · <strong style="color:var(--gold)">${gnf(total)}</strong>
          ${totOM ? `<br>OM : <strong style="color:#FF7800">${gnf(totOM)}</strong> · Espèces : <strong>${gnf(totEsp)}</strong>` : ''}
        </div>
      </div>
      <button onclick="nouvellesSaisies()"
        style="width:100%;margin-top:10px;padding:16px;border-radius:var(--r);
          border:1px solid rgba(201,168,76,.35);background:rgba(201,168,76,.06);
          color:var(--gold);font-family:'Bebas Neue',sans-serif;font-size:18px;
          letter-spacing:2px;cursor:pointer;-webkit-tap-highlight-color:transparent">
        + AJOUTER DES VENTES
      </button>
      ${renderVentesList(false)}
      ${renderNotes()}`;
    initNotes();
    return;
  }

  /* Types disponibles */
  const allTypes  = [...new Set(produits.map(p => p.type||'autre').filter(Boolean))];
  const typeOrder = ['chicha','boisson','autre'];
  const types     = typeOrder.filter(t => allTypes.includes(t)).concat(
    allTypes.filter(t => !typeOrder.includes(t))
  );
  const typeLabels = { chicha:'🔥 Chicha', boisson:'🥤 Boissons', autre:'📦 Autre' };

  const tabsHTML = types.length > 1 ? `
    <div class="type-tabs">
      ${types.map(t => `
        <button class="type-btn${t===activeType?' active':''}" data-t="${t}"
          onclick="setType('${t}')">${typeLabels[t]||t}</button>
      `).join('')}
    </div>` : '';

  const filtered = produits.filter(p => (p.type||'autre') === activeType);

  const gridHTML = `
    <div class="prod-grid" id="prod-grid">
      ${filtered.length ? filtered.map(p => {
        const idx = produits.indexOf(p);
        return `
        <button type="button" class="prod-card ${p.type||'autre'}${selectedProd?.nom===p.nom?' selected':''}"
          onclick="selectProdByIndex(${idx})">
          <div class="prod-card-nom">${escHtml(p.nom)}</div>
          <div class="prod-card-prix${!p.prix?' no-prix':''}">${p.prix ? gnf(p.prix) : '— GNF'}</div>
        </button>`;
      }).join('') : `<div class="grid-empty">Aucun produit dans cette catégorie</div>`}
    </div>`;

  $('main-body').innerHTML = banner + tabsHTML + gridHTML
    + renderVentesList(true)
    + (ventes.length ? totalBarHTML(total, totOM, totEsp) : '<div class="state-msg" style="padding:20px">Aucune vente — tapez un produit ci-dessus.</div>')
    + renderNotes();


  initNotes();
}

function totalBarHTML(total, totOM, totEsp) {
  return `
    <div class="total-bar">
      ${totOM > 0 ? `
        <div class="total-bar-row"><span>💵 Espèces</span><span>${gnf(totEsp)}</span></div>
        <div class="total-bar-row"><span style="color:#FF7800">📱 Orange Money</span>
          <span style="color:#FF7800">${gnf(totOM)}</span></div>` : ''}
      <div class="total-bar-main">
        <div><div class="total-bar-label">Total du soir</div></div>
        <div class="total-bar-val">${gnf(total)}</div>
      </div>
    </div>
    <button class="close-cta" onclick="confirmClose()">CLÔTURER MA SESSION →</button>`;
}

function renderVentesList(canDelete) {
  if (!ventes.length) return '';
  return `
    <div class="s-head">${ventes.length} vente${ventes.length>1?'s':''}</div>
    ${[...ventes].reverse().map(v => {
      const pm = v.paiement || 'especes';
      return `
        <div class="vente-item">
          <div class="vente-dot ${v.type||'autre'}"></div>
          <div class="vente-info">
            <div class="vente-label">${escHtml(v.label)}</div>
            <div class="vente-meta">×${v.qty} · ${gnf(v.prix_unit)}</div>
          </div>
          <span class="pay-badge ${pm}">${pm==='om'?'OM':'💵'}</span>
          <div class="vente-total">${gnf(v.total)}</div>
          ${canDelete ? `<button class="vente-del" onclick="deleteVente('${v.id}')">×</button>` : ''}
        </div>`;
    }).join('')}`;
}

function renderNotes() {
  return `
    <div class="s-head">Notes</div>
    <div class="notes-card">
      <textarea class="notes-area" id="note-area"
        placeholder="Commandes spéciales, observations…"
        rows="4" oninput="onNoteInput()"></textarea>
      <div class="notes-status" id="note-status"></div>
    </div>`;
}

function initNotes() {
  const area = document.getElementById('note-area');
  if (area) area.value = localStorage.getItem(noteKey()) || '';
}

function onNoteInput() {
  clearTimeout(_noteSave);
  const st = document.getElementById('note-status');
  if (st) st.textContent = '…';
  _noteSave = setTimeout(() => {
    const val = document.getElementById('note-area')?.value || '';
    localStorage.setItem(noteKey(), val);
    if (st) { st.textContent = 'Sauvegardé ✓'; setTimeout(() => { st.textContent = ''; }, 1500); }
  }, 600);
}

/* ── Filtre type ── */
function setType(t) {
  activeType = t;
  selectedProd = null;
  renderPage();
}

/* ── Sélection produit → bottom sheet ── */
function selectProdByIndex(idx) {
  const p = produits[idx];
  if (!p) return;
  selectProd(p.nom, p.prix || 0, p.type || 'autre');
}

function selectProdEl(el) {
  selectProd(el.dataset.nom, parseInt(el.dataset.prix)||0, el.dataset.type||'autre');
}

function selectProd(nom, prix, type) {
  selectedProd = { nom, prix, type };
  openConfirmSheet();
}

function openConfirmSheet() {
  try {
  if (!selectedProd) return;
  const { nom, prix, type } = selectedProd;
  const hasPrix = prix > 0;

  $('overlay-sheet').innerHTML = `
      <div class="confirm-title">${escHtml(nom)}</div>
      <div class="confirm-prix-unit">${hasPrix ? gnf(prix)+' / unité' : 'Prix à saisir'}</div>

      ${!hasPrix ? `
        <div class="prix-custom-wrap">
          <div class="prix-custom-label">Prix unitaire (GNF)</div>
          <input type="number" class="prix-custom-input" id="cs-prix"
            inputmode="numeric" placeholder="0" oninput="updateConfirmTotal()">
        </div>` : ''}

      <div class="qty-stepper">
        <button class="qty-btn" onclick="stepQty(-1)">−</button>
        <input type="number" class="qty-val" id="cs-qty" value="1" min="1"
          inputmode="numeric" oninput="updateConfirmTotal()">
        <button class="qty-btn" onclick="stepQty(1)">+</button>
      </div>

      <div class="confirm-total">
        <span class="confirm-total-label">Total</span>
        <span class="confirm-total-val" id="cs-total">${hasPrix ? gnf(prix) : '0 GNF'}</span>
      </div>

      <div class="pay-tabs" id="cs-pay-tabs">
        <button class="pay-btn${paiement==='especes'?' active especes':''}"
          onclick="setSheetPay('especes')">💵 Espèces</button>
        <button class="pay-btn${paiement==='om'?' active om':''}"
          onclick="setSheetPay('om')">📱 Orange Money</button>
      </div>

      <button class="btn-ok" id="cs-btn" onclick="confirmAdd()" style="width:100%;font-size:20px;padding:16px;letter-spacing:2px">
        ✓ AJOUTER
      </button>
      <button class="btn-cancel" onclick="closeSheet()" style="margin-top:8px;width:100%">
        Annuler
      </button>`;

  const ov = document.getElementById('overlay');
  if (ov) ov.classList.add('on');
  /* Focus prix si absent */
  if (!hasPrix) setTimeout(() => document.getElementById('cs-prix')?.focus(), 100);
  } catch(err) {
    toast('Erreur : ' + err.message, 'ko');
    console.error('openConfirmSheet:', err);
  }
}

function stepQty(delta) {
  const el = $('cs-qty');
  if (!el) return;
  const v = parseInt(el.value)||1;
  el.value = Math.max(1, v + delta);
  updateConfirmTotal();
}

function updateConfirmTotal() {
  const qty  = parseInt($('cs-qty')?.value)  || 1;
  const prix = selectedProd?.prix > 0
    ? selectedProd.prix
    : (parseFloat($('cs-prix')?.value) || 0);
  const tot  = $('cs-total');
  if (tot) tot.textContent = gnf(qty * prix);
}

function setSheetPay(p) {
  paiement = p;
  $('cs-pay-tabs')?.querySelectorAll('.pay-btn').forEach(b => {
    const isEsp = b.textContent.includes('Esp');
    const mine  = (p==='especes' && isEsp) || (p==='om' && !isEsp);
    b.className = `pay-btn${mine ? ` active ${p}` : ''}`;
  });
}

function closeSheet() {
  $('overlay').classList.remove('on');
  selectedProd = null;
}

/* ── Ajouter vente ── */
async function confirmAdd() {
  if (_savingVente || !selectedProd) return;
  if (sessionStatut === 'valide_caissier' || sessionStatut === 'valide_manager') {
    toast('Session clôturée par la caissière — impossible d\'ajouter', 'ko');
    closeSheet();
    return;
  }

  const qty   = Math.max(1, parseInt($('cs-qty')?.value) || 1);
  const prix  = selectedProd.prix > 0
    ? selectedProd.prix
    : (parseFloat($('cs-prix')?.value) || 0);
  const total = qty * prix;

  if (prix <= 0) { toast('Entrez un prix', 'ko'); $('cs-prix')?.focus(); return; }

  _savingVente = true;
  const btn = $('cs-btn');
  if (btn) { btn.disabled = true; btn.textContent = '…'; }

  try {
    const { error } = await db.from('ventes_session').insert({
      session_id:   sessionId,
      employe_id:   empId,
      label:        selectedProd.nom,
      type:         selectedProd.type,
      qty, prix_unit: prix, total,
      paiement, valide_staff: false
    });
    if (error) throw error;

    ML.logAction(`🛒 ${selectedProd.nom} ×${qty} ${paiement==='om'?'📱OM':'💵'} · ${gnf(total)}`);
    toast(`${selectedProd.nom} ×${qty} ✓`, 'ok');
    closeSheet();
  } catch(e) {
    toast('Erreur : ' + e.message, 'ko');
    if (btn) { btn.disabled = false; btn.textContent = '✓ AJOUTER'; }
  } finally { _savingVente = false; }
}

async function deleteVente(id) {
  try {
    await db.from('ventes_session').delete().eq('id', id);
  } catch(e) { toast('Erreur : ' + e.message, 'ko'); }
}

/* ── Nouvelle saisie après clôture (bloqué si caissière a validé) ── */
function nouvellesSaisies() {
  if (sessionStatut === 'valide_caissier' || sessionStatut === 'valide_manager') {
    toast('Session déjà validée par la caissière', 'ko');
    return;
  }
  closed = false;
  renderPage();
}

/* ── Clôture ── */
function confirmClose() {
  const total  = ventes.reduce((s, v) => s + (v.total || 0), 0);
  const totOM  = ventes.filter(v => v.paiement === 'om').reduce((s,v) => s+v.total, 0);
  const totEsp = total - totOM;
  $('overlay-sheet').innerHTML = `
    <div class="sheet-title">Clôturer la session ?</div>
    <div class="sheet-text">
      <strong style="color:var(--text)">${ventes.length} vente${ventes.length>1?'s':''}</strong>
      pour un total de <strong style="color:var(--gold)">${gnf(total)}</strong>.<br>
      ${totOM > 0 ? `💵 Espèces : <strong>${gnf(totEsp)}</strong> · 📱 OM : <strong style="color:#FF7800">${gnf(totOM)}</strong><br>` : ''}
      <br>Vos ventes seront envoyées à la caisse. Vous pourrez en ajouter d'autres après.
    </div>
    <div class="sheet-btns">
      <button class="btn-cancel" onclick="$('overlay').classList.remove('on')">Annuler</button>
      <button class="btn-ok" onclick="closeSession()">CLÔTURER</button>
    </div>`;
  $('overlay').classList.add('on');
}

async function closeSession() {
  $('overlay').classList.remove('on');
  try {
    const ids = ventes.map(v => v.id);
    const { error } = await db.from('ventes_session').update({ valide_staff: true }).in('id', ids);
    if (error) throw error;

    const total = ventes.reduce((s, v) => s + (v.total || 0), 0);
    ML.logAction(`✅ Session clôturée — ${empNom} · ${gnf(total)} · ${ventes.length} ventes`);
    toast('Session clôturée — envoyé à la caisse ✓', 'ok');
    closed = true;
    ventes = ventes.map(v => ({...v, valide_staff: true}));
    renderPage();
  } catch(e) { toast('Erreur : ' + e.message, 'ko'); }
}

document.addEventListener('click', e => {
  /* Clic sur le fond de l'overlay pour fermer */
  if (e.target.id === 'overlay') closeSheet();
});
</script>
</body>
</html>
