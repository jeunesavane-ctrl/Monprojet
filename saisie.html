<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Saisie — Medellin Lounge</title>
  <link rel="stylesheet" href="shared.css">
  <style>

/* ── Grille tables ── */
.tables-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  margin-bottom:24px}
.tbl-btn{
  position:relative;background:var(--bg2);
  border:1.5px solid var(--b1);border-radius:var(--r);
  padding:16px 8px 12px;text-align:center;cursor:pointer;
  transition:all var(--t);-webkit-tap-highlight-color:transparent;
  -webkit-appearance:none;appearance:none;width:100%}
.tbl-btn:active:not(.locked){transform:scale(.95)}
.tbl-label{
  font-family:'Bebas Neue',sans-serif;font-size:24px;
  color:var(--text);letter-spacing:1px;line-height:1;display:block}
.tbl-sub{
  font-size:10px;color:var(--muted);margin-top:5px;
  min-height:13px;line-height:1.2;display:block}
/* active-moi */
.tbl-btn.active-moi{
  border-color:var(--gold);background:rgba(201,168,76,.09);
  box-shadow:0 0 0 1px rgba(201,168,76,.22)}
.tbl-btn.active-moi .tbl-label{color:var(--gold)}
.tbl-btn.active-moi .tbl-sub{color:var(--gold);opacity:.8}
/* active-autre */
.tbl-btn.active-autre{border-color:rgba(201,168,76,.28)}
.tbl-btn.active-autre .tbl-label{color:rgba(201,168,76,.75)}
.tbl-btn.active-autre .tbl-sub{color:rgba(201,168,76,.5)}
/* sélectionnée */
.tbl-btn.sel{
  border-color:var(--gold);background:rgba(201,168,76,.15);
  box-shadow:0 0 0 2px rgba(201,168,76,.35);transform:scale(.97)}
/* verrouillée */
.tbl-btn.locked{opacity:.35;cursor:not-allowed;pointer-events:none}

/* ── Form vente (inline) ── */
.form-vente{
  background:var(--bg2);border:1px solid var(--b1);
  border-radius:var(--r);padding:16px;margin-bottom:16px}
.form-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px}
.form-table-lbl{
  font-family:'Bebas Neue',sans-serif;font-size:20px;
  color:var(--gold);letter-spacing:1px}
.form-close{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--b1);
  background:transparent;color:var(--muted);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent}

/* Type tabs */
.type-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.type-btn{
  padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;
  border:1px solid var(--b1);background:transparent;
  color:var(--muted);cursor:pointer;transition:all var(--t);
  -webkit-tap-highlight-color:transparent;letter-spacing:.4px}
.type-btn.active{background:rgba(201,168,76,.14);border-color:rgba(201,168,76,.5);color:var(--gold)}

/* Grille produits */
.prod-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  margin-bottom:16px;max-height:240px;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--b1) transparent}
.prod-card{
  background:var(--bg3);border:1.5px solid var(--b1);border-radius:var(--rs);
  padding:12px 10px;cursor:pointer;transition:all var(--t);
  -webkit-tap-highlight-color:transparent;-webkit-appearance:none;
  appearance:none;text-align:left;width:100%;font-family:inherit;
  position:relative}
.prod-card:active{transform:scale(.96)}
.prod-card.in-cart{border-color:var(--gold);background:rgba(201,168,76,.08)}
.prod-nom{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:3px}
.prod-prix{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--gold)}
.prod-qty-dot{
  position:absolute;top:6px;right:6px;
  background:var(--gold);color:#09090B;
  font-size:10px;font-weight:700;border-radius:50%;
  width:18px;height:18px;display:flex;align-items:center;justify-content:center}

/* Panier */
.cart-wrap{
  background:var(--bg3);border:1px solid var(--b1);
  border-radius:var(--rs);padding:12px;margin-bottom:14px}
.cart-item{
  display:flex;align-items:center;gap:8px;
  padding:7px 0;border-bottom:1px solid var(--b1)}
.cart-item:last-child{border-bottom:none}
.cart-nom{flex:1;font-size:13px;color:var(--text)}
.qty-ctrl{display:flex;align-items:center;gap:5px}
.qty-btn{
  width:28px;height:28px;border-radius:8px;background:var(--b1);
  border:none;color:var(--text);font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;font-family:inherit}
.qty-btn:active{background:rgba(201,168,76,.25)}
.qty-num{font-size:13px;font-weight:700;min-width:18px;text-align:center;color:var(--text)}
.cart-line{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--gold);min-width:80px;text-align:right}
.cart-empty{text-align:center;font-size:12px;color:var(--muted);padding:10px 0}
.cart-total-row{
  display:flex;justify-content:space-between;align-items:center;
  padding-top:10px;margin-top:6px;border-top:1px solid var(--b1)}
.cart-total-label{font-size:12px;color:var(--muted)}
.cart-total-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gold)}

/* Paiement */
.pay-tabs{display:flex;gap:8px;margin-bottom:14px}
.pay-btn{
  flex:1;padding:13px 6px;border-radius:var(--rs);border:1.5px solid var(--b1);
  background:transparent;color:var(--muted);font-size:13px;font-weight:600;
  cursor:pointer;transition:all var(--t);-webkit-tap-highlight-color:transparent;
  text-align:center;font-family:inherit}
.pay-btn.sel-esp{border-color:var(--ok);background:rgba(61,184,115,.12);color:var(--ok)}
.pay-btn.sel-om{border-color:#FF7800;background:rgba(255,120,0,.12);color:#FF7800}

/* ── Écran done ── */
.done-wrap{text-align:center;padding:40px 0 20px}
.done-icon{font-size:52px;margin-bottom:14px}
.done-title{
  font-family:'Bebas Neue',sans-serif;font-size:34px;
  letter-spacing:2px;color:var(--gold);margin-bottom:6px}
.done-detail{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:20px}
.done-total{
  font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--text);
  margin-bottom:28px;line-height:1}
.btn-add-more{
  width:100%;padding:16px;border-radius:var(--r);
  background:rgba(201,168,76,.09);border:1.5px solid rgba(201,168,76,.38);
  color:var(--gold);font-family:'Bebas Neue',sans-serif;font-size:18px;
  letter-spacing:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:background var(--t)}
.btn-add-more:active{background:rgba(201,168,76,.2)}

/* ── Écran verrouillé ── */
.locked-wrap{text-align:center;padding:60px 0}
.locked-icon{font-size:48px;margin-bottom:14px}
.locked-title{
  font-family:'Bebas Neue',sans-serif;font-size:26px;
  letter-spacing:2px;color:var(--muted);margin-bottom:8px}
.locked-sub{font-size:13px;color:var(--muted);line-height:1.7}

/* ── Section title ── */
.s-sep{height:1px;background:var(--b1);margin:20px 0}
  </style>
</head>
<body>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared.js"></script>
<script>
/* ── Constantes rôle ── */
const extra  = (() => {
  try { return JSON.parse(sessionStorage.getItem('ml_extra') || '{}'); } catch { return {}; }
})();

/* ──────────────────────────────────────────────
   ÉTAT GLOBAL
────────────────────────────────────────────── */
let session   = null;   // row sessions_caisse
let tables    = [];     // rows tables_lounge (actives)
let produits  = [];     // rows produits actifs
let cart      = [];     // [{ prod, qty }]
let tableLabel = null;  // label table sélectionnée
let paiement  = null;   // 'especes' | 'om'
let catActive = null;   // type actif dans le filtre
let empId     = null;
let empNom    = '';
let realtimeSub = null;
let _submitting = false;

/* ── Bootstrap ── */
document.body.insertAdjacentHTML('afterbegin', HEADER_HTML);
if (!initPage(['staff'])) throw new Error('accès refusé');

empId  = extra.employe_id || null;
empNom = extra.nom || 'Staff';

/* ── Squelette principal ── */
document.body.insertAdjacentHTML('beforeend', `
<div id="screen-main" class="container">
  <div class="page-header">
    <h1 class="page-title">Saisie des ventes</h1>
    <p class="page-sub" id="lbl-date"></p>
  </div>

  <div class="s-head" id="tables-head">Tables</div>
  <div class="tables-grid" id="tables-grid"></div>

  <div id="form-vente" style="display:none">
    <div class="form-vente">
      <div class="form-head">
        <span class="form-table-lbl" id="form-tbl-lbl"></span>
        <button class="form-close" onclick="resetForm()">✕</button>
      </div>

      <div class="s-head" style="margin-bottom:8px">Produits</div>
      <div class="type-tabs" id="type-tabs"></div>
      <div class="prod-grid" id="prod-grid"></div>

      <div class="s-head" style="margin-bottom:8px">Panier</div>
      <div class="cart-wrap" id="cart-wrap">
        <div class="cart-empty" id="cart-empty">Aucun produit ajouté</div>
        <div id="cart-items"></div>
        <div class="cart-total-row" id="cart-total-row" style="display:none">
          <span class="cart-total-label">Total</span>
          <span class="cart-total-val" id="cart-total-val">0 GNF</span>
        </div>
      </div>

      <div class="s-head" style="margin-bottom:8px">Paiement</div>
      <div class="pay-tabs">
        <button class="pay-btn" id="pay-esp" onclick="setPay('especes')">💵 Espèces</button>
        <button class="pay-btn" id="pay-om"  onclick="setPay('om')">📱 Orange Money</button>
      </div>

      <button class="btn btn-primary" style="width:100%" onclick="openConfirm()">
        Valider la commande
      </button>
      <button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="resetForm()">
        Annuler
      </button>
    </div>
  </div>
</div>

<div id="screen-confirm" class="container" style="display:none">
  <div class="page-header">
    <h1 class="page-title">Confirmation</h1>
  </div>
  <div id="confirm-body"></div>
  <div style="display:flex;gap:10px;margin-top:6px">
    <button class="btn btn-ghost" style="flex:1" onclick="backToForm()">Modifier</button>
    <button class="btn btn-primary" style="flex:1" id="btn-submit" onclick="submitVente()">Confirmer</button>
  </div>
</div>

<div id="screen-done" class="container" style="display:none">
  <div class="done-wrap">
    <div class="done-icon">✓</div>
    <div class="done-title">Saisie envoyée</div>
    <div class="done-detail" id="done-detail"></div>
    <div class="done-total" id="done-total"></div>
    <button class="btn-add-more" onclick="nouvellesSaisies()">+ AJOUTER DES VENTES</button>
  </div>
</div>

<div id="screen-locked" class="container" style="display:none">
  <div class="locked-wrap">
    <div class="locked-icon">🔒</div>
    <div class="locked-title">Session clôturée</div>
    <div class="locked-sub" id="locked-sub">
      La caissière a clôturé la session.<br>
      Les ventes d'aujourd'hui ne peuvent plus être modifiées.
    </div>
  </div>
</div>
`);

/* ══════════════════════════════════════════════
   INIT
══════════════════════════════════════════════ */
async function init() {
  $('lbl-date').textContent = frDate();

  if (!empId) {
    toast('Compte employé non configuré', 'ko');
    return;
  }

  await Promise.all([loadSession(), loadTables(), loadProduits()]);

  /* Définir catégorie par défaut */
  const types = [...new Set(produits.map(p => p.type).filter(Boolean))];
  const ordre = ['chicha','boisson','autre'];
  catActive = ordre.find(t => types.includes(t)) || types[0] || 'chicha';

  applySessionStatut();
  renderTables();
  startRealtime();
}

async function loadSession() {
  /* Créer si absente (atomique — UNIQUE date) */
  let { data, error } = await db.from('sessions_caisse')
    .insert({ date: todayISO(), statut: 'ouvert' })
    .select('id,statut,fond_caisse')
    .single();

  if (error?.code === '23505') {
    ({ data } = await db.from('sessions_caisse')
      .select('id,statut,fond_caisse')
      .eq('date', todayISO())
      .single());
  } else if (error) {
    console.error('session:', error.message);
  }
  session = data;
}

async function loadTables() {
  const { data } = await db.from('tables_lounge')
    .select('id,label,ordre,ouverte_par')
    .not('actif','is',false)
    .order('ordre');
  tables = data || [];
}

async function loadProduits() {
  const { data } = await db.from('produits')
    .select('id,nom,type,prix_defaut,stock_actuel')
    .not('actif', 'is', false)
    .order('nom');
  produits = data || [];
}

/* ══════════════════════════════════════════════
   SESSION STATUT
══════════════════════════════════════════════ */
function isLocked() {
  return session && ['valide_caissier','valide_manager'].includes(session.statut);
}

function applySessionStatut() {
  if (isLocked()) {
    showScreen('locked');
  }
}

function showScreen(name) {
  ['main','confirm','done','locked'].forEach(s =>
    $('screen-' + s).style.display = s === name ? 'block' : 'none'
  );
  window.scrollTo(0, 0);
}

/* ══════════════════════════════════════════════
   REALTIME — sessions_caisse
══════════════════════════════════════════════ */
function startRealtime() {
  if (!session) return;
  realtimeSub = db.channel('saisie-rt')
    .on('postgres_changes', {
      event: 'UPDATE', schema: 'public', table: 'sessions_caisse',
      filter: `id=eq.${session.id}`
    }, payload => {
      session = { ...session, ...payload.new };
      if (isLocked()) showScreen('locked');
    })
    .subscribe();
}

/* ══════════════════════════════════════════════
   GRILLE TABLES
══════════════════════════════════════════════ */
function renderTables() {
  const grid = $('tables-grid');
  if (!tables.length) {
    grid.innerHTML = `<p style="color:var(--muted);font-size:13px;grid-column:span 3;text-align:center;padding:16px">
      Aucune table configurée dans Paramètres.</p>`;
    return;
  }

  const locked = isLocked();

  grid.innerHTML = tables.map(t => {
    let cls = 'tbl-btn';
    let sub = '';

    if (locked) {
      cls += ' locked';
      sub = 'Clôturée';
    } else if (t.ouverte_par === empId) {
      cls += ' active-moi';
      sub = 'Ma table';
    } else if (t.ouverte_par) {
      cls += ' active-autre';
      sub = 'En service';
    }

    if (tableLabel === t.label) cls += ' sel';

    return `<button class="${cls}" onclick="selectTable('${jsStr(t.label)}')">
      <span class="tbl-label">${escHtml(t.label)}</span>
      <span class="tbl-sub">${sub}</span>
    </button>`;
  }).join('');
}

/* ══════════════════════════════════════════════
   SÉLECTION TABLE
══════════════════════════════════════════════ */
function selectTable(label) {
  if (isLocked()) { showScreen('locked'); return; }

  tableLabel = label;
  cart       = [];
  paiement   = null;

  $('form-tbl-lbl').textContent = 'Table ' + label;
  $('form-vente').style.display = 'block';

  renderTables();
  renderTypeTabs();
  renderProds();
  renderCart();
  syncPayBtns();

  $('form-vente').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ══════════════════════════════════════════════
   PRODUITS
══════════════════════════════════════════════ */
function renderTypeTabs() {
  const types = [...new Set(produits.map(p => p.type).filter(Boolean))];
  const ordre = ['chicha','boisson','autre'];
  const sorted = ordre.filter(t => types.includes(t))
    .concat(types.filter(t => !ordre.includes(t)));

  if (sorted.length <= 1) {
    $('type-tabs').innerHTML = '';
    return;
  }
  const labels = { chicha: 'Chicha', boisson: 'Boissons', autre: 'Autre' };
  $('type-tabs').innerHTML = sorted.map(t =>
    `<button class="type-btn${t === catActive ? ' active' : ''}" onclick="setCat('${jsStr(t)}')">${escHtml(labels[t] || t)}</button>`
  ).join('');
}

function setCat(t) {
  catActive = t;
  renderTypeTabs();
  renderProds();
}

function renderProds() {
  const filtered = catActive
    ? produits.filter(p => p.type === catActive)
    : produits;

  if (!filtered.length) {
    $('prod-grid').innerHTML = `<p style="color:var(--muted);font-size:13px;grid-column:span 2;padding:8px 0">Aucun produit</p>`;
    return;
  }

  $('prod-grid').innerHTML = filtered.map(p => {
    const inCart = cart.find(x => x.prod.id === p.id);
    return `<button class="prod-card${inCart ? ' in-cart' : ''}" onclick="addProd('${jsStr(p.id)}')">
      <div class="prod-nom">${escHtml(p.nom)}</div>
      <div class="prod-prix">${gnf(p.prix_defaut)}</div>
      ${inCart ? `<div class="prod-qty-dot">${inCart.qty}</div>` : ''}
    </button>`;
  }).join('');
}

/* ══════════════════════════════════════════════
   PANIER
══════════════════════════════════════════════ */
function addProd(prodId) {
  const prod = produits.find(p => p.id === prodId);
  if (!prod) return;
  const i = cart.findIndex(x => x.prod.id === prodId);
  if (i >= 0) cart[i].qty++;
  else        cart.push({ prod, qty: 1 });
  renderProds();
  renderCart();
}

function changeQty(prodId, delta) {
  const i = cart.findIndex(x => x.prod.id === prodId);
  if (i < 0) return;
  cart[i].qty += delta;
  if (cart[i].qty <= 0) cart.splice(i, 1);
  renderProds();
  renderCart();
}

function cartTotal() {
  return cart.reduce((s, x) => s + x.prod.prix_defaut * x.qty, 0);
}

function renderCart() {
  const empty    = $('cart-empty');
  const items    = $('cart-items');
  const totalRow = $('cart-total-row');

  if (!cart.length) {
    empty.style.display    = 'block';
    items.innerHTML        = '';
    totalRow.style.display = 'none';
    return;
  }

  empty.style.display    = 'none';
  totalRow.style.display = 'flex';

  items.innerHTML = cart.map(x => `
    <div class="cart-item">
      <span class="cart-nom">${escHtml(x.prod.nom)}</span>
      <div class="qty-ctrl">
        <button class="qty-btn" onclick="changeQty('${jsStr(x.prod.id)}',-1)">−</button>
        <span class="qty-num">${x.qty}</span>
        <button class="qty-btn" onclick="changeQty('${jsStr(x.prod.id)}',1)">+</button>
      </div>
      <span class="cart-line">${gnf(x.prod.prix_defaut * x.qty)}</span>
    </div>`).join('');

  $('cart-total-val').textContent = gnf(cartTotal());
}

/* ══════════════════════════════════════════════
   PAIEMENT
══════════════════════════════════════════════ */
function setPay(mode) {
  paiement = mode;
  syncPayBtns();
}

function syncPayBtns() {
  $('pay-esp').className = 'pay-btn' + (paiement === 'especes' ? ' sel-esp' : '');
  $('pay-om').className  = 'pay-btn' + (paiement === 'om'      ? ' sel-om'  : '');
}

function resetForm() {
  tableLabel = null; cart = []; paiement = null;
  $('form-vente').style.display = 'none';
  renderTables();
  window.scrollTo(0, 0);
}

/* ══════════════════════════════════════════════
   CONFIRMATION
══════════════════════════════════════════════ */
function openConfirm() {
  if (isLocked()) { showScreen('locked'); return; }
  if (!tableLabel)    { toast('Sélectionne une table', 'ko');          return; }
  if (!cart.length)   { toast('Ajoute au moins un produit', 'ko');     return; }
  if (!paiement)      { toast('Choisis un mode de paiement', 'ko');    return; }

  const total = cartTotal();
  $('confirm-body').innerHTML = `
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--b1)">
        <span style="color:var(--muted);font-size:13px">Table</span>
        <span style="font-weight:600">${escHtml(tableLabel)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--b1)">
        <span style="color:var(--muted);font-size:13px">Paiement</span>
        <span style="font-weight:600">${paiement === 'especes' ? '💵 Espèces' : '📱 Orange Money'}</span>
      </div>
      ${cart.map(x => `
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--b1)">
        <span style="font-size:13px;color:var(--muted)">${escHtml(x.prod.nom)} ×${x.qty}</span>
        <span style="font-size:13px">${gnf(x.prod.prix_defaut * x.qty)}</span>
      </div>`).join('')}
      <div style="display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;margin-top:4px">
        <span style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">Total</span>
        <span style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--gold)">${gnf(total)}</span>
      </div>
    </div>`;

  showScreen('confirm');
}

function backToForm() {
  showScreen('main');
  $('form-vente').style.display = 'block';
}

/* ══════════════════════════════════════════════
   SOUMISSION
══════════════════════════════════════════════ */
async function submitVente() {
  if (_submitting) return;
  if (isLocked()) { showScreen('locked'); return; }

  const btn = $('btn-submit');
  btn.disabled = true; btn.textContent = 'Envoi…';
  _submitting = true;

  try {
    /* S'assurer que la session existe */
    if (!session) await loadSession();

    /* Ouvrir la table si libre (SET ouverte_par si IS NULL) */
    const { data: tbl } = await db.from('tables_lounge')
      .select('ouverte_par')
      .eq('label', tableLabel)
      .single();
    if (tbl && !tbl.ouverte_par) {
      await db.from('tables_lounge')
        .update({ ouverte_par: empId })
        .eq('label', tableLabel);
    }

    /* Construire les lignes (une par produit) */
    const rows = cart.map(x => ({
      session_id:    session.id,
      employe_id:    empId,
      produit_id:    x.prod.id,
      produit_nom:   x.prod.nom,
      qty:           x.qty,
      prix_unitaire: x.prod.prix_defaut,
      total:         x.prod.prix_defaut * x.qty,
      paiement:      paiement,
      table_label:   tableLabel
    }));

    const { error } = await db.from('ventes_session').insert(rows);
    if (error) throw error;

    await ML.logAction(`vente T${tableLabel} ${gnf(cartTotal())} ${paiement}`);

    /* Recharger tables pour refléter ouverte_par */
    await loadTables();

    showDone();

  } catch(e) {
    toast('Erreur : ' + e.message, 'ko');
    btn.disabled = false; btn.textContent = 'Confirmer';
  } finally {
    _submitting = false;
  }
}

/* ══════════════════════════════════════════════
   ÉCRAN DONE
══════════════════════════════════════════════ */
function showDone() {
  const total  = cartTotal();
  const detail = `Table ${tableLabel} — ${paiement === 'especes' ? 'Espèces' : 'Orange Money'}
${cart.map(x => `${x.qty}× ${x.prod.nom}`).join(', ')}`;

  $('done-detail').textContent = detail;
  $('done-total').textContent  = gnf(total);

  /* Reset pour la prochaine saisie */
  tableLabel = null; cart = []; paiement = null;

  showScreen('done');
}

/* ══════════════════════════════════════════════
   NOUVELLE SAISIE
══════════════════════════════════════════════ */
function nouvellesSaisies() {
  if (isLocked()) { showScreen('locked'); return; }

  $('form-vente').style.display = 'none';
  renderTables();
  showScreen('main');
}

init();
</script>
</body>
</html>
