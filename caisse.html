<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Caisse — Medellin Lounge</title>
  <link rel="stylesheet" href="shared.css">
  <style>
/* ── Lecture seule ── */
.ro-banner{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.03);border:1px solid var(--b1);
  border-radius:var(--rs);padding:9px 14px;
  font-size:12px;color:var(--muted)}

/* ── Session header ── */
.sess-header{
  background:var(--bg2);border-radius:var(--r);padding:14px 16px;
  border:1px solid var(--b1);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 2px 10px rgba(0,0,0,.4);
  display:flex;justify-content:space-between;align-items:center}
.sess-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px}
.sess-count-num{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--gold);line-height:1}
.sess-count-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.live-badge{display:flex;align-items:center;gap:6px;font-size:10px;
  color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-top:3px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 6px rgba(61,184,115,.6);
  animation:pulse 1.8s ease-in-out infinite;flex-shrink:0}
.live-dot-off{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(1.5)}}

/* ── Fond de caisse ── */
.fond-card{
  background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r);
  padding:14px 16px;display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 2px 8px rgba(0,0,0,.3)}
.fond-val{
  font-family:'Bebas Neue',sans-serif;font-size:28px;
  color:var(--gold);line-height:1;margin-top:4px}

/* ── Mouvements ── */
.mvt-header{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}
.mvt-btns{display:flex;gap:8px}
.btn-entree{
  padding:7px 14px;font-size:12px;font-weight:600;border-radius:var(--rs);cursor:pointer;
  background:rgba(61,184,115,.1);border:1px solid rgba(61,184,115,.3);
  color:var(--ok);letter-spacing:.5px;-webkit-tap-highlight-color:transparent;font-family:inherit}
.btn-entree:active{background:rgba(61,184,115,.18)}
.btn-sortie{
  padding:7px 14px;font-size:12px;font-weight:600;border-radius:var(--rs);cursor:pointer;
  background:rgba(201,73,74,.1);border:1px solid rgba(201,73,74,.3);
  color:var(--danger);letter-spacing:.5px;-webkit-tap-highlight-color:transparent;font-family:inherit}
.btn-sortie:active{background:rgba(201,73,74,.18)}
.mvt-list{display:flex;flex-direction:column}
.mvt-item{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid rgba(255,255,255,.04)}
.mvt-item:last-child{border-bottom:none}
.mvt-badge{
  width:24px;height:24px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700}
.mvt-badge.entree{background:rgba(61,184,115,.12);color:var(--ok);border:1px solid rgba(61,184,115,.25)}
.mvt-badge.sortie{background:rgba(201,73,74,.12);color:var(--danger);border:1px solid rgba(201,73,74,.25)}
.mvt-info{flex:1;min-width:0}
.mvt-motif{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvt-note{font-size:11px;color:var(--muted);margin-top:1px}
.mvt-montant{font-family:'Bebas Neue',sans-serif;font-size:15px;flex-shrink:0;white-space:nowrap}
.mvt-montant.entree{color:var(--ok)}
.mvt-montant.sortie{color:var(--danger)}
.mvt-del{
  background:none;border:none;cursor:pointer;color:rgba(255,255,255,.2);
  font-size:13px;padding:4px;flex-shrink:0;transition:color var(--t)}
.mvt-del:active{color:var(--danger)}

/* ── Crédits / Ardoises ── */
.credit-list{display:flex;flex-direction:column}
.credit-item{
  display:flex;align-items:center;gap:10px;padding:11px 14px;
  border-bottom:1px solid rgba(255,255,255,.04);transition:opacity var(--t)}
.credit-item:last-child{border-bottom:none}
.credit-item.done{opacity:.45}
.credit-info{flex:1;min-width:0}
.credit-nom{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.credit-note{font-size:11px;color:var(--muted);margin-top:1px}
.credit-montant{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--gold);white-space:nowrap;flex-shrink:0}
.credit-toggle{
  width:28px;height:28px;border-radius:50%;font-size:13px;
  cursor:pointer;flex-shrink:0;border:1px solid rgba(61,184,115,.3);
  display:flex;align-items:center;justify-content:center;
  background:rgba(61,184,115,.1);color:var(--ok);
  -webkit-tap-highlight-color:transparent;transition:all var(--t)}
.credit-toggle.undo{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1);color:var(--muted)}
.credit-badge{
  font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;white-space:nowrap;flex-shrink:0}
.credit-badge.doit{background:rgba(201,168,76,.1);color:var(--gold);border:1px solid rgba(201,168,76,.2)}
.credit-badge.rembourse{background:rgba(61,184,115,.1);color:var(--ok);border:1px solid rgba(61,184,115,.2)}

/* ── Staff cards ── */
.staff-card{
  background:var(--bg2);border-radius:var(--r);overflow:hidden;
  border:1px solid var(--b1);
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 2px 8px rgba(0,0,0,.35)}
.staff-head{
  padding:13px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;
  transition:background var(--t);-webkit-tap-highlight-color:transparent;
  background:linear-gradient(180deg,var(--bg3) 0%,rgba(15,15,18,.5) 100%);
  border-bottom:1px solid var(--b1)}
.staff-head:active{background:var(--bg4)}
.staff-avatar{
  width:36px;height:36px;border-radius:50%;background:var(--bg4);
  border:1px solid var(--b1);display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;color:var(--text2);flex-shrink:0}
.staff-info{flex:1;min-width:0}
.staff-nom{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.staff-sub{font-size:12px;color:var(--muted);margin-top:1px}
.staff-total{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold);flex-shrink:0}
.staff-arrow{color:var(--muted);font-size:11px;transition:transform .2s;margin-left:8px}
.staff-card.open .staff-arrow{transform:rotate(180deg)}
.staff-body{display:none;padding:12px 14px;flex-direction:column;gap:0}
.staff-card.open .staff-body{display:flex}

/* Table group dans staff card */
.tbl-group{margin-bottom:10px}
.tbl-group-head{
  font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--gold);margin-bottom:4px;opacity:.8}
.cv-row{
  display:flex;align-items:center;gap:8px;
  padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.cv-row:last-child{border-bottom:none}
.cv-label{font-size:13px;font-weight:500;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-qty{font-size:12px;color:var(--muted);flex-shrink:0}
.cv-pm{font-size:11px;flex-shrink:0}
.cv-total{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--gold);
  white-space:nowrap;flex-shrink:0}

/* Vérification argent reçu */
.verif-wrap{
  margin-top:10px;padding:10px 12px;
  background:rgba(255,255,255,.02);border:1px solid var(--b1);
  border-radius:var(--rs)}
.verif-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;
  color:var(--muted);margin-bottom:8px;font-weight:600}
.verif-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.verif-row:last-of-type{margin-bottom:0}
.verif-lbl{font-size:12px;color:var(--muted);min-width:80px;flex-shrink:0}
.verif-input{
  flex:1;background:var(--bg3);border:1px solid var(--b1);border-radius:var(--rs);
  padding:8px 10px;font-family:'Bebas Neue',sans-serif;font-size:16px;
  color:var(--text);text-align:right;outline:none;transition:border-color var(--t)}
.verif-input:focus{border-color:var(--gold)}
.ecart-serv{
  font-size:12px;font-weight:600;text-align:right;margin-top:6px;min-height:16px;
  padding-top:6px;border-top:1px solid var(--b1)}

/* ── Recap ── */
.recap-card{
  background:var(--glow);border:1px solid var(--gring);
  border-radius:var(--r);padding:18px;
  box-shadow:0 0 0 1px var(--gring) inset,0 4px 20px rgba(201,168,76,.07)}
.recap-row{
  display:flex;justify-content:space-between;align-items:center;
  font-size:13px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.recap-row:last-of-type{border-bottom:none}
.recap-row span:last-child{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--gold)}
.recap-total{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:12px 0 8px;margin-top:4px;border-top:1px solid var(--gring)}
.recap-total-lbl{font-size:14px;font-weight:600}
.recap-total-val{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--gold);line-height:1}
.recap-sep{height:1px;background:rgba(255,255,255,.06);margin:8px 0}
.reel-input{
  width:100%;padding:13px;background:var(--bg3);border:1px solid var(--b2);
  border-radius:var(--rs);font-size:22px;font-family:'Bebas Neue',sans-serif;
  color:var(--text);text-align:right;letter-spacing:1px;outline:none;
  transition:border-color var(--t)}
.reel-input:focus{border-color:var(--gring)}

/* ── Validation ── */
.btn-validate{
  width:100%;padding:18px;
  background:linear-gradient(180deg,var(--goldl) 0%,var(--gold) 100%);
  border:none;border-radius:var(--r);
  color:#060606;font-family:'Bebas Neue',sans-serif;
  font-size:21px;letter-spacing:3px;cursor:pointer;
  box-shadow:0 4px 24px rgba(201,168,76,.28),0 1px 0 rgba(255,255,255,.15) inset;
  transition:opacity var(--t),transform var(--t);
  -webkit-tap-highlight-color:transparent}
.btn-validate:active{opacity:.85;transform:scale(.99)}
.btn-validate:disabled{opacity:.2;cursor:not-allowed;box-shadow:none}
.validated-card{
  background:var(--okbg);border:1px solid var(--okb);
  border-radius:var(--r);padding:22px;text-align:center}
.validated-title{font-family:'Bebas Neue',sans-serif;font-size:20px;
  letter-spacing:2px;color:var(--ok);margin-bottom:6px}
.alert-warn{
  background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.2);
  border-radius:var(--rs);padding:10px 14px;font-size:13px;
  color:rgba(255,255,255,.6);margin-bottom:10px}

/* ── Notes caissier ── */
.notes-card{
  background:var(--bg2);border:1px solid var(--b1);border-radius:var(--r);
  padding:14px}
.notes-area{
  width:100%;background:transparent;border:none;resize:none;
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;
  line-height:1.6;outline:none;min-height:90px}
.notes-area::placeholder{color:var(--muted)}
.notes-status{font-size:11px;color:var(--muted);margin-top:6px;text-align:right;min-height:14px}
  </style>
</head>
<body>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared.js"></script>
<script>
/* ══════════════════════════════════════════════
   ÉTAT
══════════════════════════════════════════════ */
let sessionData    = null;
let allVentes      = [];   // ventes_session de la session
let allMouvements  = [];   // mouvements_caisse
let allCredits     = [];   // credits
let allAchats      = [];   // achats_session
let allVerifs      = [];   // verifications_staff  ← CDC v6
let employes       = [];

let _finalizing  = false;
let _savingOp    = false;
let _clotureCtx  = null;
let _noteSave;
let _omSave;
let _verifSave   = {};     // debounce par empId

const isReadOnly  = () => !['caissier','manager','owner'].includes(ML.getRole());
const caisseKey   = () => `ml_caisse_note_${todayISO()}`;

/* ── Bootstrap ── */
document.body.insertAdjacentHTML('afterbegin', HEADER_HTML);
if (!ML.guard(['caissier','manager','owner','associe'])) throw new Error('accès refusé');
renderNav(); ML.initAutoLock(); loadNavBadges();

/* ── Squelette ── */
document.body.insertAdjacentHTML('beforeend', `
<div class="container" id="main-body">
  <div class="state-msg">Chargement…</div>
</div>
<div class="container" id="remb-wrap" style="padding-top:0"></div>
<div id="overlay"><div class="sheet" id="overlay-sheet"></div></div>
`);

/* ══════════════════════════════════════════════
   CHARGEMENT
══════════════════════════════════════════════ */
async function init() {
  await _dbReady;
  const today = todayISO();
  try {
    /* Créer session si absente (atomique) */
    let { data: sess, error: sErr } = await db.from('sessions_caisse')
      .insert({ date: today, statut: 'ouvert' })
      .select('*').single();

    if (sErr?.code === '23505') {
      ({ data: sess } = await db.from('sessions_caisse')
        .select('*').eq('date', today).single());
    } else if (sErr) {
      /* Associé en lecture seule → pas de création */
      ({ data: sess } = await db.from('sessions_caisse')
        .select('*').eq('date', today).maybeSingle());
      if (!sess) {
        $('main-body').innerHTML = `
          <div class="state-msg" style="padding:44px 0;text-align:center">
            <div style="font-size:36px;opacity:.3;margin-bottom:10px">📋</div>
            <div style="font-size:15px;font-weight:500;margin-bottom:6px">Aucune session ce soir</div>
            <div style="font-size:13px;color:var(--muted)">La caisse n'a pas encore été ouverte.</div>
          </div>`;
        return;
      }
    }
    sessionData = sess;

    /* Chargement parallèle */
    const [vR, mR, eR, cR, aR, vfR] = await Promise.all([
      db.from('ventes_session').select('*').eq('session_id', sess.id).order('created_at'),
      db.from('mouvements_caisse').select('*').eq('session_id', sess.id).order('created_at'),
      db.from('employes').select('id,nom,prenom').not('actif','is',false),
      db.from('credits').select('*').eq('session_id', sess.id).order('created_at'),
      db.from('achats_session').select('*').eq('session_id', sess.id).order('created_at'),
      db.from('verifications_staff').select('*').eq('session_id', sess.id)
    ]);

    allVentes     = vR.data  || [];
    allMouvements = mR.data  || [];
    employes      = eR.data  || [];
    allCredits    = cR.data  || [];
    allAchats     = aR.data  || [];
    allVerifs     = vfR.data || [];

    renderCaisse();
    subscribeRealtime(sess.id);
    loadRemboursements();

  } catch(e) {
    $('main-body').innerHTML = `<div class="state-msg err">Erreur : ${e.message}</div>`;
  }
}

/* ══════════════════════════════════════════════
   REALTIME
══════════════════════════════════════════════ */
function subscribeRealtime(sessId) {
  const refresh = async () => {
    const [v, m, c, a, vf] = await Promise.all([
      db.from('ventes_session').select('*').eq('session_id', sessId).order('created_at'),
      db.from('mouvements_caisse').select('*').eq('session_id', sessId).order('created_at'),
      db.from('credits').select('*').eq('session_id', sessId).order('created_at'),
      db.from('achats_session').select('*').eq('session_id', sessId).order('created_at'),
      db.from('verifications_staff').select('*').eq('session_id', sessId)
    ]);
    allVentes     = v.data  || [];
    allMouvements = m.data  || [];
    allCredits    = c.data  || [];
    allAchats     = a.data  || [];
    allVerifs     = vf.data || [];
    renderCaisse();
  };

  db.channel('caisse-rt')
    .on('postgres_changes',{event:'*',schema:'public',table:'ventes_session',
      filter:`session_id=eq.${sessId}`}, refresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'mouvements_caisse',
      filter:`session_id=eq.${sessId}`}, refresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'credits',
      filter:`session_id=eq.${sessId}`}, refresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'verifications_staff',
      filter:`session_id=eq.${sessId}`}, refresh)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'sessions_caisse',
      filter:`id=eq.${sessId}`}, payload => {
      if (payload.new) {
        sessionData = { ...sessionData, ...payload.new };
        if (sessionData.statut === 'ouvert') { _finalizing = false; _clotureCtx = null; }
        renderCaisse();
      }
    })
    .subscribe();
}

/* ══════════════════════════════════════════════
   RENDER PRINCIPAL
══════════════════════════════════════════════ */
function renderCaisse() {
  if (!sessionData) return;
  const ro    = isReadOnly();
  const isVal = ['valide_caissier','valide_manager'].includes(sessionData.statut);

  /* ── Totaux base ventes ── */
  const fond        = sessionData.fond_caisse || 0;
  const totEntrees  = allMouvements.filter(m=>m.type==='entree').reduce((s,m)=>s+m.montant,0);
  const totSorties  = allMouvements.filter(m=>m.type==='sortie').reduce((s,m)=>s+m.montant,0);
  const totAchats   = allAchats.reduce((s,a)=>s+a.montant,0);

  /* Totaux déclarés (ventes) */
  const totDecl     = allVentes.reduce((s,v)=>s+(v.total||0),0);
  const totDeclOM   = allVentes.filter(v=>v.paiement==='om').reduce((s,v)=>s+(v.total||0),0);
  const totDeclEsp  = totDecl - totDeclOM;

  /* CDC v6 — theoriqueEsp = fond + SUM(verif.recu_especes) + entrées - sorties - achats */
  const totRecuEsp  = allVerifs.reduce((s,v)=>s+(v.recu_especes||0),0);
  const totRecuOM   = allVerifs.reduce((s,v)=>s+(v.recu_om||0),0);
  const theoriqueEsp = fond + totRecuEsp + totEntrees - totSorties - totAchats;

  const reelEsp  = sessionData.total_reel;
  const reelOM   = sessionData.total_om_verifie;
  const ecartEsp = reelEsp != null ? theoriqueEsp - reelEsp : null;
  const ecartOM  = (totDeclOM > 0 && reelOM != null) ? totRecuOM - reelOM : null;
  const ecart    = ecartEsp != null
    ? (totDeclOM === 0 ? ecartEsp : ecartOM != null ? ecartEsp + ecartOM : null)
    : null;

  /* ── Grouper par staff ── */
  const byEmp = {};
  allVentes.forEach(v => {
    if (!byEmp[v.employe_id]) byEmp[v.employe_id] = [];
    byEmp[v.employe_id].push(v);
  });
  const staffIds = Object.keys(byEmp);

  /* ── 1. Header ── */
  const header = `
    <div class="sess-header">
      <div>
        <div class="sess-title">${frDate(sessionData.date)}</div>
        <div class="live-badge">
          <span class="${isVal?'live-dot-off':'live-dot'}"></span>
          ${isVal ? 'Session clôturée' : ro ? 'Consultation' : 'Session ouverte'}
        </div>
      </div>
      <div style="text-align:right">
        <div class="sess-count-num">${staffIds.length}</div>
        <div class="sess-count-lbl">serveuse${staffIds.length!==1?'s':''}</div>
      </div>
    </div>
    ${ro ? `<div class="ro-banner">👁 Lecture seule — seul le caissier peut modifier</div>` : ''}`;

  /* ── 2. Fond de caisse ── */
  const fondBlock = `
    <div class="s-head">Fond de caisse</div>
    <div class="fond-card">
      <div>
        <div class="kpi-label">Montant d'ouverture</div>
        <div class="fond-val">${gnf(fond)}</div>
      </div>
      ${!ro && !isVal
        ? `<button class="btn btn-secondary" onclick="openFondModal()" style="flex-shrink:0">
             ${fond?'Modifier':'+ Définir'}
           </button>` : ''}
    </div>`;

  /* ── 3. Mouvements de caisse ── */
  const now = Date.now();
  const mvtRows = allMouvements.length
    ? allMouvements.map(m => {
        const ago = Math.floor((now - new Date(m.created_at).getTime()) / 60000);
        const hm  = new Date(m.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
        const locked = ago > 10;
        return `
          <div class="mvt-item">
            <div class="mvt-badge ${m.type}">${m.type==='entree'?'↑':'↓'}</div>
            <div class="mvt-info">
              <div class="mvt-motif">${escHtml(m.motif)}</div>
              <div class="mvt-note">${escHtml(m.note||'')} <span style="opacity:.4;font-size:10px">${ago<1?'à l\'instant':ago<60?`il y a ${ago} min`:hm}</span></div>
            </div>
            <div class="mvt-montant ${m.type}">${m.type==='entree'?'+':'−'} ${gnf(m.montant)}</div>
            ${!ro && !isVal
              ? locked
                ? `<button class="mvt-del" disabled style="opacity:.25;cursor:not-allowed">🔒</button>`
                : `<button class="mvt-del" onclick="deleteMouvement('${m.id}')">✕</button>`
              : ''}
          </div>`;
      }).join('')
    : `<div class="state-msg" style="padding:14px 0">Aucun mouvement.</div>`;

  const mouvBlock = `
    <div class="mvt-header">
      <div class="s-head" style="margin:0">Mouvements de caisse</div>
      ${!ro && !isVal ? `
        <div class="mvt-btns">
          <button class="btn-entree" onclick="openMouvModal('entree')">+ Entrée</button>
          <button class="btn-sortie" onclick="openMouvModal('sortie')">+ Sortie</button>
        </div>` : ''}
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <div class="mvt-list">${mvtRows}</div>
    </div>`;

  /* ── 4. Crédits / Ardoises ── */
  const totalCredits = allCredits.filter(c=>!c.rembourse).reduce((s,c)=>s+c.montant,0);
  const creditRows = allCredits.length
    ? allCredits.map(c => `
        <div class="credit-item${c.rembourse?' done':''}">
          <div class="credit-info">
            <div class="credit-nom">${escHtml(c.client_nom)}</div>
            ${c.note ? `<div class="credit-note">${escHtml(c.note)}</div>` : ''}
          </div>
          <div class="credit-montant">${gnf(c.montant)}</div>
          ${!ro && !isVal
            ? `<button class="credit-toggle${c.rembourse?' undo':''}"
                 onclick="toggleCredit('${c.id}',${!c.rembourse})">
                 ${c.rembourse?'↩':'✓'}
               </button>
               <button class="mvt-del" onclick="deleteCredit('${c.id}')">✕</button>`
            : `<span class="credit-badge ${c.rembourse?'rembourse':'doit'}">${c.rembourse?'Remb.':'Dû'}</span>`}
        </div>`).join('')
    : `<div class="state-msg" style="padding:14px 0">Aucun crédit noté.</div>`;

  const creditsBlock = `
    <div class="mvt-header">
      <div class="s-head" style="margin:0">Crédits / Ardoises
        ${totalCredits>0?`<span style="font-size:12px;color:var(--gold);font-family:'DM Sans',sans-serif;margin-left:8px">· ${gnf(totalCredits)} dus</span>`:''}
      </div>
      ${!ro && !isVal
        ? `<button class="btn-entree" onclick="openCreditModal()"
             style="background:rgba(201,168,76,.08);border-color:rgba(201,168,76,.25);color:var(--gold)">
             + Crédit
           </button>` : ''}
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <div class="credit-list">${creditRows}</div>
    </div>`;

  /* ── 5. Cartes serveuses ── */
  const staffCards = staffIds.length === 0
    ? `<div class="state-msg" style="padding:20px">Aucune vente enregistrée ce soir.</div>`
    : staffIds.map(eid => {
        const emp   = employes.find(e => e.id === eid);
        const nom   = emp ? [emp.prenom,emp.nom].filter(Boolean).join(' ') : 'Inconnu';
        const init  = nom.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
        const vs    = byEmp[eid];
        const tot   = vs.reduce((s,v)=>s+(v.total||0),0);
        const verif = allVerifs.find(f=>f.employe_id===eid) || null;

        /* Déclaré par la serveuse */
        const declEsp = vs.filter(v=>v.paiement==='especes').reduce((s,v)=>s+(v.total||0),0);
        const declOM  = vs.filter(v=>v.paiement==='om').reduce((s,v)=>s+(v.total||0),0);

        /* Reçu par la caissière (depuis verif ou vide) */
        const recuEsp = verif?.recu_especes ?? null;
        const recuOM  = verif?.recu_om      ?? null;

        /* Écart serveuse = total déclaré - total reçu (calculé en JS) */
        const ecartServ = (recuEsp !== null || recuOM !== null)
          ? (declEsp + declOM) - ((recuEsp||0) + (recuOM||0))
          : null;
        const ecartServColor = ecartServ === null ? 'var(--muted)'
          : ecartServ === 0 ? 'var(--ok)' : ecartServ > 0 ? 'var(--danger)' : '#5BA3CC';
        const ecartServTxt = ecartServ === null ? '—'
          : ecartServ === 0 ? '✓ Comptes bons'
          : ecartServ > 0   ? `Manque ${gnf(ecartServ)}`
          : `Excédent ${gnf(Math.abs(ecartServ))}`;

        /* Ventes groupées par table_label */
        const byTable = {};
        vs.forEach(v => {
          const tl = v.table_label || '—';
          if (!byTable[tl]) byTable[tl] = [];
          byTable[tl].push(v);
        });
        const tableKeys = Object.keys(byTable).sort();

        const tableRows = tableKeys.map(tl => {
          const rows = byTable[tl].map(v => `
            <div class="cv-row">
              <div class="cv-label">${escHtml(v.produit_nom || '—')}</div>
              <div class="cv-qty">×${v.qty||1}</div>
              <span class="cv-pm">${v.paiement==='om'?'📱':'💵'}</span>
              <div class="cv-total">${gnf(v.total||0)}</div>
            </div>`).join('');
          const tblTot = byTable[tl].reduce((s,v)=>s+(v.total||0),0);
          return `
            <div class="tbl-group">
              <div class="tbl-group-head">Table ${escHtml(tl)} — ${gnf(tblTot)}</div>
              ${rows}
            </div>`;
        }).join('');

        /* Inputs vérification (uniquement si session pas clôturée + rôle caissier) */
        const verifBlock = (!isVal && !ro) ? `
          <div class="verif-wrap">
            <div class="verif-title">Argent reçu de ${escHtml(nom)}</div>
            <div class="verif-row">
              <span class="verif-lbl">💵 Espèces</span>
              <input class="verif-input" type="number" inputmode="numeric"
                id="verif-esp-${jsStr(eid)}" placeholder="${declEsp}"
                value="${recuEsp ?? ''}"
                onchange="saveVerif('${jsStr(eid)}','${jsStr(nom)}',${declEsp},${declOM})">
            </div>
            ${declOM > 0 ? `
            <div class="verif-row">
              <span class="verif-lbl" style="color:#FF7800">📱 OM</span>
              <input class="verif-input" type="number" inputmode="numeric"
                style="color:#FF7800"
                id="verif-om-${jsStr(eid)}" placeholder="${declOM}"
                value="${recuOM ?? ''}"
                onchange="saveVerif('${jsStr(eid)}','${jsStr(nom)}',${declEsp},${declOM})">
            </div>` : ''}
            <div class="ecart-serv" id="ecart-serv-${jsStr(eid)}"
              style="color:${ecartServColor}">
              ${ecartServTxt}
            </div>
          </div>` : '';

        /* Affichage écart en lecture seule */
        const verifRO = (isVal || ro) && verif ? `
          <div style="padding:8px 0 4px;border-top:1px solid var(--b1);margin-top:8px;
            display:flex;justify-content:space-between;font-size:12px">
            <span style="color:var(--muted)">Reçu : 💵 ${gnf(verif.recu_especes||0)}${verif.recu_om?` · 📱 ${gnf(verif.recu_om)}`:''}
            </span>
            <span style="color:${ecartServColor};font-weight:600">${ecartServTxt}</span>
          </div>` : '';

        return `
          <div class="staff-card" id="sc-${eid}">
            <div class="staff-head" onclick="toggleStaff('${eid}')">
              <div class="staff-avatar">${init}</div>
              <div class="staff-info">
                <div class="staff-nom">${escHtml(nom)}</div>
                <div class="staff-sub">${vs.length} vente${vs.length>1?'s':''}
                  ${declOM>0?`<span style="color:#FF7800;font-size:10px"> · 📱 ${gnf(declOM)}</span>`:''}
                </div>
              </div>
              <div class="staff-total">${gnf(tot)}</div>
              <span class="staff-arrow">▼</span>
            </div>
            <div class="staff-body">
              ${tableRows}
              ${verifBlock}
              ${verifRO}
            </div>
          </div>`;
      }).join('');

  /* ── 6. Récapitulatif ── */
  const fmtEcart = (e, label) => {
    if (e === null) return '';
    const col = e===0?'var(--ok)':e>0?'var(--danger)':'#5BA3CC';
    const txt = e===0?'✓ Exacte':e>0?`Manque ${gnf(e)}`:`Excédent ${gnf(Math.abs(e))}`;
    return `<div class="recap-row"><span style="color:${col}">${label}</span>
      <span style="color:${col} !important;font-size:13px !important">${txt}</span></div>`;
  };

  const reelSection = isVal
    ? `<div class="recap-sep"></div>
       <div class="recap-row">
         <span>💵 Espèces comptées</span><span>${reelEsp!=null?gnf(reelEsp):'—'}</span>
       </div>
       ${fmtEcart(ecartEsp,'Écart espèces')}
       ${totDeclOM>0?`<div class="recap-row" style="color:#FF7800">
         <span>📱 OM reçu caissière</span><span>${reelOM!=null?gnf(reelOM):'—'}</span>
       </div>${fmtEcart(ecartOM,'Écart OM')}` : ''}
       ${fmtEcart(ecart,'Écart total')}`
    : ro
    ? `<div class="recap-sep"></div>
       <div class="recap-row"><span style="color:var(--muted)">Réel non encore renseigné</span><span>—</span></div>`
    : `<div class="recap-sep"></div>
       <div class="kpi-label" style="margin-bottom:8px">💵 Espèces comptées en caisse</div>
       <input class="reel-input" id="reel-input" type="number" inputmode="numeric"
         placeholder="0" value="${reelEsp??''}"
         oninput="updateEcartDisplay(${theoriqueEsp},${totDeclOM},${totRecuOM})">
       <div id="ecart-esp-disp" style="font-size:12px;font-weight:500;min-height:16px;margin:4px 0 10px;text-align:right">
         ${ecartEsp!==null?`<span style="color:${ecartEsp===0?'var(--ok)':ecartEsp>0?'var(--danger)':'#5BA3CC'}">${ecartEsp===0?'✓ Exacte':ecartEsp>0?`Manque ${gnf(ecartEsp)}`:`Excédent ${gnf(Math.abs(ecartEsp))}`}</span>`:''}
       </div>
       ${totDeclOM>0?`
       <div class="kpi-label" style="margin-bottom:8px;color:rgba(255,120,0,.7)">📱 OM reçu sur le téléphone</div>
       <input class="reel-input" id="om-input" type="number" inputmode="numeric"
         placeholder="${totRecuOM}" value="${reelOM??''}"
         style="color:#FF7800;border-color:rgba(255,120,0,.3)"
         oninput="updateEcartDisplay(${theoriqueEsp},${totDeclOM},${totRecuOM})">
       <div id="ecart-om-disp" style="font-size:12px;font-weight:500;min-height:16px;margin:4px 0 10px;text-align:right"></div>`:''}
       <div id="ecart-total-disp" style="font-size:13px;font-weight:600;text-align:right;min-height:18px"></div>`;

  const recap = `
    <div class="s-head">Récapitulatif</div>
    <div class="recap-card">
      <div style="display:flex;justify-content:space-between;align-items:center;
        padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--b1)">
        <div>
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:3px">Total ventes déclarées</div>
          <div style="font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--gold);line-height:1">${gnf(totDecl)}</div>
        </div>
        <div style="text-align:right;font-size:12px;line-height:1.8">
          <div>💵 Espèces <strong>${gnf(totDeclEsp)}</strong></div>
          ${totDeclOM?`<div style="color:#FF7800">📱 OM <strong>${gnf(totDeclOM)}</strong></div>`:''}
        </div>
      </div>
      <div class="recap-row"><span>Fond de caisse</span><span>${gnf(fond)}</span></div>
      <div class="recap-row"><span>+ Reçu espèces (serveuses)</span><span>${gnf(totRecuEsp)}</span></div>
      ${totDeclOM?`<div class="recap-row" style="color:#FF7800"><span>+ Reçu OM (serveuses)</span><span>${gnf(totRecuOM)}</span></div>`:''}
      ${totEntrees?`<div class="recap-row"><span style="color:var(--ok)">+ Entrées</span><span style="color:var(--ok) !important">${gnf(totEntrees)}</span></div>`:''}
      ${totSorties?`<div class="recap-row"><span style="color:var(--danger)">− Sorties</span><span style="color:var(--danger) !important">${gnf(totSorties)}</span></div>`:''}
      ${totAchats?`<div class="recap-row"><span style="color:var(--danger)">− Achats</span><span style="color:var(--danger) !important">${gnf(totAchats)}</span></div>`:''}
      <div class="recap-total">
        <span class="recap-total-lbl">Théorique espèces</span>
        <span class="recap-total-val">${gnf(theoriqueEsp)}</span>
      </div>
      ${reelSection}
    </div>`;

  /* ── 7. Clôture ── */
  let clotureBlock;
  if (isVal) {
    clotureBlock = `
      <div class="validated-card">
        <div style="font-size:28px;margin-bottom:8px">✓</div>
        <div class="validated-title">
          ${sessionData.statut==='valide_manager'?'Rapport créé':'Clôturée — en attente manager'}
        </div>
        ${sessionData.note_caissier
          ? `<div style="margin-top:8px;font-size:12px;color:var(--muted);font-style:italic">
               "${escHtml(sessionData.note_caissier)}"</div>` : ''}
      </div>`;
  } else if (ro) {
    clotureBlock = `
      <div class="validated-card" style="background:rgba(255,255,255,.03);border-color:var(--b1)">
        <div style="font-size:26px;opacity:.3;margin-bottom:8px">⏳</div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:2px;color:var(--muted)">
          En attente du caissier
        </div>
      </div>`;
  } else {
    const nbVerif = staffIds.filter(eid => allVerifs.find(f=>f.employe_id===eid)).length;
    clotureBlock = `
      <div class="field">
        <label>Note de clôture (optionnel)</label>
        <textarea id="f-note" placeholder="Observations, écarts, remarques…" rows="2">${sessionData.note_caissier||''}</textarea>
      </div>
      ${staffIds.length>0 && nbVerif<staffIds.length
        ? `<div class="alert-warn">
             ⏳ ${staffIds.length-nbVerif} serveuse${staffIds.length-nbVerif>1?'s':''} sans vérification — vous pouvez clôturer quand même
           </div>` : ''}
      <button class="btn-validate" onclick="confirmValidate(${theoriqueEsp},${totDeclOM},${totRecuOM})"
        ${staffIds.length===0?'disabled':''}>
        CLÔTURER LA CAISSE
      </button>`;
  }

  /* ── 8. Notes de service ── */
  const notesBlock = !ro ? `
    <div class="s-head">Notes de service</div>
    <div class="notes-card">
      <textarea class="notes-area" id="caisse-note-area"
        placeholder="Notes de travail, rappels, produits manquants…"
        rows="3" oninput="onCaisseNoteInput()"></textarea>
      <div class="notes-status" id="caisse-note-status"></div>
    </div>` : '';

  $('main-body').innerHTML =
    header + fondBlock + mouvBlock + creditsBlock +
    `<div class="s-head">Serveuses</div>` +
    staffCards + recap +
    `<div class="s-head">${ro?'État':'Clôture'}</div>` +
    clotureBlock + notesBlock;

  const na = document.getElementById('caisse-note-area');
  if (na) na.value = localStorage.getItem(caisseKey()) || '';
}

}

/* ══════════════════════════════════════════════
   VÉRIFICATION STAFF → verifications_staff UPSERT
══════════════════════════════════════════════ */
async function saveVerif(empId, empNom, declEsp, declOM) {
  clearTimeout(_verifSave[empId]);
  _verifSave[empId] = setTimeout(async () => {
    const espEl = document.getElementById('verif-esp-' + empId);
    const omEl  = document.getElementById('verif-om-'  + empId);
    const dispEl = document.getElementById('ecart-serv-' + empId);

    const recuEsp = espEl?.value !== '' ? (parseInt(espEl.value)||0) : null;
    const recuOM  = omEl?.value  !== '' ? (parseInt(omEl.value) ||0) : null;

    if (recuEsp === null && recuOM === null) return;

    try {
      await db.from('verifications_staff').upsert({
        session_id:   sessionData.id,
        employe_id:   empId,
        recu_especes: recuEsp ?? 0,
        recu_om:      recuOM  ?? 0
      }, { onConflict: 'session_id,employe_id' });

      /* Mettre à jour l'écart en temps réel sans reload complet */
      const tot = (declEsp + declOM);
      const recu = (recuEsp??0) + (recuOM??0);
      const ecartServ = tot - recu;
      if (dispEl) {
        const col = ecartServ===0?'var(--ok)':ecartServ>0?'var(--danger)':'#5BA3CC';
        const txt = ecartServ===0?'✓ Comptes bons':ecartServ>0?`Manque ${gnf(ecartServ)}`:`Excédent ${gnf(Math.abs(ecartServ))}`;
        dispEl.style.color   = col;
        dispEl.textContent   = txt;
      }

      /* Mettre à jour allVerifs local */
      const idx = allVerifs.findIndex(f=>f.employe_id===empId);
      if (idx>=0) { allVerifs[idx].recu_especes=recuEsp??0; allVerifs[idx].recu_om=recuOM??0; }
      else allVerifs.push({ employe_id:empId, recu_especes:recuEsp??0, recu_om:recuOM??0 });

    } catch(e) { toast('Erreur sauvegarde : '+e.message, 'ko'); }
  }, 700);
}

/* ══════════════════════════════════════════════
   AFFICHAGE ÉCART (inputs recap)
══════════════════════════════════════════════ */
function updateEcartDisplay(theoriqueEsp, totDeclOM, totRecuOM) {
  const espEl  = document.getElementById('reel-input');
  const omEl   = document.getElementById('om-input');
  const dispE  = document.getElementById('ecart-esp-disp');
  const dispOM = document.getElementById('ecart-om-disp');
  const dispT  = document.getElementById('ecart-total-disp');
  if (!espEl || !dispE) return;

  const reelEsp  = espEl.value !== '' ? (parseInt(espEl.value)||0) : null;
  if (reelEsp === null) { dispE.innerHTML=''; if(dispOM)dispOM.innerHTML=''; if(dispT)dispT.textContent=''; return; }

  const ecartEsp = theoriqueEsp - reelEsp;
  const colE = ecartEsp===0?'var(--ok)':ecartEsp>0?'var(--danger)':'#5BA3CC';
  const txtE = ecartEsp===0?'✓ Exacte':ecartEsp>0?`Manque ${gnf(ecartEsp)}`:`Excédent ${gnf(Math.abs(ecartEsp))}`;
  dispE.innerHTML = `<span style="color:${colE}">${txtE}</span>`;

  /* Autosave OM */
  if (omEl?.value) {
    const reelOM = parseInt(omEl.value)||0;
    const ecartOM = totRecuOM - reelOM;
    const colOM = ecartOM===0?'var(--ok)':ecartOM>0?'var(--danger)':'#5BA3CC';
    const txtOM = ecartOM===0?'✓ Conforme':ecartOM>0?`Manque ${gnf(ecartOM)}`:`Surplus ${gnf(Math.abs(ecartOM))}`;
    if (dispOM) dispOM.innerHTML = `<span style="color:${colOM}">${txtOM}</span>`;

    clearTimeout(_omSave);
    _omSave = setTimeout(async () => {
      await db.from('sessions_caisse')
        .update({ total_om_verifie: reelOM })
        .eq('id', sessionData.id).catch(()=>{});
      sessionData.total_om_verifie = reelOM;
    }, 800);

    if (dispT) {
      const ecartT = ecartEsp + ecartOM;
      const colT = ecartT===0?'var(--ok)':ecartT>0?'var(--danger)':'#5BA3CC';
      const txtT = ecartT===0?'✓ Caisse exacte':ecartT>0?`Manque ${gnf(ecartT)}`:`Excédent de ${gnf(Math.abs(ecartT))}`;
      dispT.style.color = colT; dispT.textContent = txtT;
    }
  } else {
    if (dispOM) dispOM.innerHTML = '';
    if (dispT && totDeclOM>0) { dispT.style.color='var(--muted)'; dispT.textContent='Entrez le montant OM pour voir l\'écart total'; }
    else if (dispT) { const c=ecartEsp===0?'var(--ok)':ecartEsp>0?'var(--danger)':'#5BA3CC'; dispT.style.color=c; dispT.textContent=txtE; }
  }
}

/* ══════════════════════════════════════════════
   FOND DE CAISSE
══════════════════════════════════════════════ */
function openFondModal() {
  $('overlay-sheet').innerHTML = `
    <div class="sheet-title">Fond de caisse</div>
    <div class="field" style="margin-bottom:16px">
      <label>Montant (GNF)</label>
      <input id="fond-input" type="number" inputmode="numeric" placeholder="0"
        value="${sessionData.fond_caisse||''}"
        style="font-size:22px;font-family:'Bebas Neue',sans-serif;text-align:right;padding:13px">
    </div>
    <div class="sheet-btns">
      <button class="btn-cancel" onclick="$('overlay').classList.remove('on')">Annuler</button>
      <button class="btn-ok" onclick="saveFond()">ENREGISTRER</button>
    </div>`;
  $('overlay').classList.add('on');
  setTimeout(()=>document.getElementById('fond-input')?.focus(),80);
}
async function saveFond() {
  const val = parseInt(document.getElementById('fond-input')?.value)||0;
  if (val<0) { toast('Montant invalide','ko'); return; }
  try {
    await db.from('sessions_caisse').update({fond_caisse:val}).eq('id',sessionData.id);
    sessionData.fond_caisse = val;
    $('overlay').classList.remove('on');
    toast('Fond de caisse enregistré ✓','ok');
    renderCaisse();
  } catch(e) { toast('Erreur : '+e.message,'ko'); }
}

/* ══════════════════════════════════════════════
   MOUVEMENTS
══════════════════════════════════════════════ */
const MOTIFS_E = ['Versement espèces','Remise en caisse','Remboursement reçu','Correction','Autre'];
const MOTIFS_S = ['Achat / Dépense','Retrait','Remboursement client','Avance employé','Frais divers','Autre'];

function openMouvModal(type) {
  const motifs = type==='entree'?MOTIFS_E:MOTIFS_S;
  const color  = type==='entree'?'var(--ok)':'var(--danger)';
  $('overlay-sheet').innerHTML = `
    <div class="sheet-title" style="color:${color}">${type==='entree'?'↑ ENTRÉE':'↓ SORTIE'}</div>
    <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:16px">
      <div class="field">
        <label>Motif</label>
        <select id="mv-sel" onchange="$('mv-custom-wrap').style.display=this.value==='Autre'?'':'none'">
          ${motifs.map(m=>`<option>${m}</option>`).join('')}
        </select>
      </div>
      <div class="field" id="mv-custom-wrap" style="display:none">
        <label>Préciser</label>
        <input id="mv-custom" type="text" placeholder="Description…">
      </div>
      <div class="field">
        <label>Montant (GNF)</label>
        <input id="mv-montant" type="number" inputmode="numeric" placeholder="0"
          style="font-size:20px;font-family:'Bebas Neue',sans-serif;text-align:right">
      </div>
      <div class="field">
        <label>Note (optionnel)</label>
        <input id="mv-note" type="text" placeholder="Détail…">
      </div>
    </div>
    <div class="sheet-btns">
      <button class="btn-cancel" onclick="$('overlay').classList.remove('on')">Annuler</button>
      <button class="btn-ok" onclick="saveMouvement('${type}')">ENREGISTRER</button>
    </div>`;
  $('overlay').classList.add('on');
  setTimeout(()=>document.getElementById('mv-montant')?.focus(),80);
}
async function saveMouvement(type) {
  if (_savingOp) return;
  const sel    = document.getElementById('mv-sel');
  const custom = document.getElementById('mv-custom');
  const motif  = (sel?.value==='Autre'&&custom?.value.trim()) ? custom.value.trim() : sel?.value;
  const montant = parseInt(document.getElementById('mv-montant')?.value)||0;
  const note    = document.getElementById('mv-note')?.value.trim()||null;
  if (!motif)         { toast('Motif requis','ko'); return; }
  if (!(montant>0))   { toast('Montant invalide (doit être positif)','ko'); return; }
  _savingOp = true;
  try {
    const {data,error} = await db.from('mouvements_caisse')
      .insert({session_id:sessionData.id,type,motif,montant,note}).select().single();
    if (error) throw error;
    $('overlay').classList.remove('on');
    toast(`${type==='entree'?'Entrée':'Sortie'} enregistrée ✓`,'ok');
    ML.logAction(`${type==='entree'?'↑ Entrée':'↓ Sortie'} caisse · ${motif} · ${gnf(montant)}`);
    allMouvements.push(data);
    renderCaisse();
  } catch(e){ toast('Erreur : '+e.message,'ko'); } finally{ _savingOp=false; }
}
async function deleteMouvement(id) {
  try {
    await db.from('mouvements_caisse').delete().eq('id',id);
    allMouvements = allMouvements.filter(m=>m.id!==id);
    renderCaisse(); toast('Mouvement supprimé','ok');
  } catch{ toast('Erreur','ko'); }
}

async function saveCredit() {

  const note       = document.getElementById('cr-note')?.value.trim()||null;

async function toggleCredit(id, rembourse) {

    await db.from('credits').update({rembourse}).eq('id',id);
    allCredits = allCredits.map(c=>c.id===id?{...c,rembourse}:c);
    renderCaisse(); toast(rembourse?'Remboursé ✓':'Remise en ardoise','ok');

}
async function deleteCredit(id) {
  try {
    await db.from('credits').delete().eq('id',id);
    allCredits = allCredits.filter(c=>c.id!==id);
    renderCaisse(); toast('Crédit supprimé','ok');
  } catch{ toast('Erreur','ko'); }
}

/* ══════════════════════════════════════════════
   CLÔTURE
══════════════════════════════════════════════ */
function confirmValidate(theoriqueEsp, totDeclOM, totRecuOM) {
  const espEl = document.getElementById('reel-input');
  const omEl  = document.getElementById('om-input');
  const reelEsp = espEl?.value !== '' ? (parseInt(espEl.value)||null) : null;
  const reelOM  = omEl?.value  !== '' ? (parseInt(omEl.value) ||null)
                  : (sessionData.total_om_verifie ?? null);
  const note    = ($('f-note')?.value||'').trim();

  _clotureCtx = { theoriqueEsp, reelEsp, reelOM, totDeclOM, totRecuOM, note };

  const ecartEsp = reelEsp!=null ? theoriqueEsp-reelEsp : null;
  const ecartOM  = (totDeclOM>0&&reelOM!=null) ? totRecuOM-reelOM : null;
  const ecartT   = ecartEsp!=null ? (totDeclOM===0?ecartEsp:ecartOM!=null?ecartEsp+ecartOM:null) : null;

  const colT = ecartT==null?'var(--muted)':ecartT===0?'var(--ok)':ecartT>0?'var(--danger)':'#5BA3CC';
  const txtT = ecartT==null?'—':ecartT===0?'±0 ✓ Caisse exacte':ecartT>0?`Manque ${gnf(ecartT)}`:`Excédent ${gnf(Math.abs(ecartT))}`;

  $('overlay-sheet').innerHTML = `
    <div class="sheet-title">Clôturer la caisse ?</div>
    <div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--b1)">
        <span style="color:var(--muted)">Théorique espèces</span><span>${gnf(theoriqueEsp)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--b1)">
        <span style="color:var(--muted)">Espèces comptées</span><span>${reelEsp!=null?gnf(reelEsp):'—'}</span>
      </div>
      ${ecartEsp!=null?`<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;padding:6px 0;border-bottom:1px solid var(--b1)">
        <span style="color:${ecartEsp===0?'var(--ok)':ecartEsp>0?'var(--danger)':'#5BA3CC'}">Écart espèces</span>
        <span style="color:${ecartEsp===0?'var(--ok)':ecartEsp>0?'var(--danger)':'#5BA3CC'}">${ecartEsp===0?'✓ Exacte':ecartEsp>0?`Manque ${gnf(ecartEsp)}`:`Excédent ${gnf(Math.abs(ecartEsp))}`}</span>
      </div>`:''}
      ${totDeclOM>0?`<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;padding:6px 0;border-bottom:1px solid var(--b1)">
        <span style="color:${ecartOM==null?'var(--muted)':ecartOM===0?'var(--ok)':ecartOM>0?'var(--danger)':'#5BA3CC'}">Écart OM</span>
        <span style="color:${ecartOM==null?'var(--muted)':ecartOM===0?'var(--ok)':ecartOM>0?'var(--danger)':'#5BA3CC'}">${ecartOM==null?'—':ecartOM===0?'✓ Conforme':ecartOM>0?`Manque ${gnf(ecartOM)}`:`Surplus ${gnf(Math.abs(ecartOM))}`}</span>
      </div>`:''}
      <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700;
        padding:10px;margin-top:6px;border-radius:8px;
        background:${ecartT===0?'rgba(61,184,115,.08)':ecartT!=null&&ecartT>0?'rgba(201,73,74,.08)':'rgba(255,255,255,.03)'}">
        <span style="color:${colT}">Écart total</span>
        <span style="color:${colT}">${txtT}</span>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5">
        Cette action envoie les données au gestionnaire. Impossible de modifier après.
      </div>
    </div>
    <div class="sheet-btns">
      <button class="btn-cancel" onclick="$('overlay').classList.remove('on')">Annuler</button>
      <button class="btn-ok" onclick="validateSession()">CONFIRMER</button>
    </div>`;
  $('overlay').classList.add('on');
}

async function validateSession() {
  if (_finalizing) return;
  if (!_clotureCtx) { toast('Contexte introuvable — réessayez','ko'); return; }
  const { theoriqueEsp, reelEsp, reelOM, totDeclOM, totRecuOM, note } = _clotureCtx;
  _finalizing = true;
  $('overlay').classList.remove('on');
  try {
    const empId    = ML.getExtra()?.employe_id || null;
    const ecartEsp = reelEsp!=null ? theoriqueEsp-reelEsp : null;
    const ecartOM  = (totDeclOM>0&&reelOM!=null) ? totRecuOM-reelOM : null;
    const ecartVal = ecartEsp!=null
      ? (totDeclOM===0 ? ecartEsp : ecartOM!=null ? ecartEsp+ecartOM : null)
      : null;

    const payload = {
      statut:           'valide_caissier',
      note_caissier:    note||null,
      total_reel:       reelEsp??null,
      total_om_verifie: reelOM??null,
      caissier_id:      empId,
      ecart_especes:    ecartEsp??null,   /* seul déduit de la paie caissière */
      ecart_om:         ecartOM??null,    /* informatif uniquement */
      ecart:            ecartVal??null    /* écart total affiché */
    };

    let {error} = await db.from('sessions_caisse').update(payload).eq('id',sessionData.id);
    if (error && /ecart_om|ecart_especes/.test(error.message||'')) {
      /* Colonnes pas encore migrées — repli sans ecart_om */
      delete payload.ecart_om; delete payload.ecart_especes;
      payload.ecart = ecartEsp ?? null;
      ({error} = await db.from('sessions_caisse').update(payload).eq('id',sessionData.id));
    }
    if (error) throw error;

    Object.assign(sessionData, payload);
    ML.logAction(`💰 Caisse clôturée · ${gnf(allVentes.reduce((s,v)=>s+(v.total||0),0))}`);
    toast('Caisse clôturée ✓','ok');
    _clotureCtx = null;
    renderCaisse();
  } catch(e) { _finalizing=false; toast('Erreur : '+e.message,'ko'); }
}

function onCaisseNoteInput() {
  clearTimeout(_noteSave);
  const st = document.getElementById('caisse-note-status');
  if (st) st.textContent = '…';
  _noteSave = setTimeout(() => {
    const v = document.getElementById('caisse-note-area')?.value||'';
    localStorage.setItem(caisseKey(), v);
    if (st) { st.textContent='Sauvegardé ✓'; setTimeout(()=>{st.textContent='';},1500); }
  }, 600);
}

/* ══════════════════════════════════════════════
   REMBOURSEMENTS ÉCART
══════════════════════════════════════════════ */
async function loadRemboursements() {
  const wrap = $('remb-wrap');
  if (!wrap || ML.getRole()!=='caissier') return;
  try {
    const {data:rembs} = await db.from('remboursements_ecart')
      .select('id,employe_id,montant,note,created_at')
      .eq('statut','en_attente').order('created_at',{ascending:false});
    if (!rembs?.length) { wrap.innerHTML=''; return; }

    const ids = [...new Set(rembs.map(r=>r.employe_id))];
    const {data:emps} = await db.from('employes').select('id,nom,prenom').in('id',ids);
    const nomMap = {};
    (emps||[]).forEach(e=>nomMap[e.id]=[e.prenom,e.nom].filter(Boolean).join(' '));

    wrap.innerHTML = `
      <div class="card" style="border-left:3px solid var(--gold)">
        <div class="card-head">
          <div class="card-title">💰 Remboursements à confirmer</div>
          <span style="font-size:11px;background:rgba(201,168,76,.15);color:var(--gold);
            padding:2px 8px;border-radius:20px;font-weight:600">${rembs.length}</span>
        </div>
        <div class="card-body" style="gap:10px">
          ${rembs.map(r=>`
            <div style="display:flex;align-items:center;gap:10px" id="rrow-${r.id}">
              <div style="flex:1">
                <div style="font-size:14px;font-weight:500">${escHtml(nomMap[r.employe_id]||'?')}</div>
                <div style="font-size:12px;color:var(--muted)">${gnf(r.montant)}${r.note?` · ${escHtml(r.note)}`:''}</div>
              </div>
              <button onclick="validerRemb('${r.id}')"
                style="padding:6px 12px;background:rgba(61,184,115,.1);border:1px solid rgba(61,184,115,.3);
                border-radius:6px;color:var(--ok);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">
                ✓ Confirmer
              </button>
              <button onclick="rejeterRemb('${r.id}')"
                style="padding:6px 10px;background:var(--bg2);border:1px solid var(--b1);
                border-radius:6px;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit">
                ✕
              </button>
            </div>`).join('')}
        </div>
      </div>`;
  } catch(e){ console.warn('remb:',e.message); }
}
async function validerRemb(id) {
  try {
    await db.from('remboursements_ecart').update({statut:'valide'}).eq('id',id);
    toast('Remboursement confirmé ✓','ok'); loadRemboursements();
  } catch(e){ toast('Erreur : '+e.message,'ko'); }
}
async function rejeterRemb(id) {
  try {
    await db.from('remboursements_ecart').update({statut:'rejete'}).eq('id',id);
    toast('Rejeté','ok'); loadRemboursements();
  } catch(e){ toast('Erreur : '+e.message,'ko'); }
}

document.addEventListener('click', e => {
  if (e.target?.id === 'overlay') $('overlay').classList.remove('on');
});

init();
